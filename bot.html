<body class="bot-body">

    <!-- Fullscreen Background Carousel -->
    <div class="fullscreen-carousel">
        <div class="carousel-slide active" style="background-image: url('assets/bg1.jpg');"></div>
        <div class="carousel-slide" style="background-image: url('assets/bg2.jpg');"></div>
        <div class="carousel-slide" style="background-image: url('assets/bg3.jpg');"></div>
        <div class="carousel-overlay"></div>
    </div>

    <div class="bot-app-layout">
        <!-- Top Header (Seamless on page, No Card Box, No Border) -->
        <header class="bot-top-header">
            <!-- Right: Return to Timings (Clean transparent link) -->
            <a href="home.html" class="bot-back-btn" id="btn-back-timings" title="العودة لمواقيت الصلاة">
                <i class="fa-solid fa-arrow-right"></i>
                <span>المواقيت</span>
            </a>

            <!-- Center: AI Brand Title (Pure Icon, No Border, No Background, No Subtitle) -->
            <div class="bot-brand-badge">
                <i class="fa-solid fa-robot bot-header-icon" aria-hidden="true"></i>
                <h1 class="bot-main-title">المساعد الإسلامي الذكي</h1>
            </div>

            <!-- Left: Actions (New Chat + History Drawer Toggle) -->
            <div class="bot-header-actions">
                <button type="button" class="bot-header-action-btn" id="btn-new-chat-top" title="محادثة جديدة">
                    <i class="fa-solid fa-plus"></i>
                    <span>محادثة جديدة</span>
                </button>
                <button type="button" class="bot-header-action-btn" id="btn-toggle-sidebar" title="سجل المحادثات" aria-label="فتح سجل المحادثات">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                </button>
            </div>
        </header>

        <!-- Main Chat Box Container -->
        <main class="bot-chat-container is-empty" id="bot-chat-container">
            
            <!-- Welcome Hero (Empty State: Centered Mosque Icon + Title directly above centered input) -->
            <div class="bot-welcome-card" id="bot-welcome-card">
                <div class="welcome-mosque-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 512" class="welcome-tab-mosque-svg" aria-hidden="true">
                        <path fill="currentColor" d="M400 0c5 0 9.8 2.4 12.8 6.4c34.7 46.3 78.1 74.9 133.5 111.5c0 0 0 0 0 0s0 0 0 0c5.2 3.4 10.5 7 16 10.6c28.9 19.2 45.7 51.7 45.7 86.1c0 28.6-11.3 54.5-29.8 73.4l-356.4 0c-18.4-19-29.8-44.9-29.8-73.4c0-34.4 16.7-66.9 45.7-86.1c5.4-3.6 10.8-7.1 16-10.6c0 0 0 0 0 0s0 0 0 0C309.1 81.3 352.5 52.7 387.2 6.4c3-4 7.8-6.4 12.8-6.4zM288 512l0-72c0-13.3-10.7-24-24-24s-24 10.7-24 24l0 72-48 0c-17.7 0-32-14.3-32-32l0-128c0-17.7 14.3-32 32-32l416 0c17.7 0 32 14.3 32 32l0 128c0 17.7-14.3 32-32 32l-48 0 0-72c0-13.3-10.7-24-24-24s-24 10.7-24 24l0 72-64 0 0-58c0-19-8.4-37-23-49.2L400 384l-25 20.8C360.4 417 352 435 352 454l0 58-64 0zM70.4 5.2c5.7-4.3 13.5-4.3 19.2 0l16 12C139.8 42.9 160 83.2 160 126l0 2L0 128l0-2C0 83.2 20.2 42.9 54.4 17.2l16-12zM0 160l160 0 0 136.6c-19.1 11.1-32 31.7-32 55.4l0 128c0 9.6 2.1 18.6 5.8 26.8c-6.6 3.4-14 5.2-21.8 5.2l-64 0c-26.5 0-48-21.5-48-48L0 176l0-16z"/>
                    </svg>
                </div>
                <h2 class="welcome-title">أهلاً بك في <span>قبلة المسلم</span></h2>
            </div>

            <!-- Messages Scroll Flow -->
            <div class="chat-messages-flow" id="chat-messages-flow"></div>

            <!-- Typing Indicator (Animated Gold Dots) -->
            <div class="typing-indicator-row" id="typing-indicator-row">
                <div class="msg-avatar">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <div class="typing-bubble">
                    <span class="typing-text-label">جاري استحضار الإجابة</span>
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                </div>
            </div>

            <!-- Bottom Input Bar Area (Clean & Transparent) -->
            <div class="bot-input-area" id="bot-input-area">
                <div class="bot-input-box-wrapper">
                    <textarea 
                        id="chat-input" 
                        class="chat-textarea" 
                        placeholder="اكتب سؤالك أو استفسارك هنا..." 
                        rows="1"
                        aria-label="رسالتك للمساعد الإسلامي"></textarea>
                    
                    <button type="button" id="btn-send-message" class="btn-send-message" title="إرسال السؤال" disabled aria-label="إرسال">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </div>

        </main>

        <!-- Footer -->
        <footer class="bot-footer">
            جميع الحقوق محفوظة &copy; 2026 - قبلة المسلم
        </footer>
    </div>

    <!-- History Sidebar Drawer (ChatGPT-style for Mobile, Tablet, Desktop) -->
    <div class="bot-sidebar-overlay" id="bot-sidebar-overlay"></div>
    <aside class="bot-sidebar-drawer" id="bot-sidebar-drawer" aria-label="سجل المحادثات">
        <div class="bot-sidebar-header">
            <div class="bot-sidebar-title">
                <i class="fa-solid fa-clock-rotate-left"></i>
                <span>المحادثات السابقة</span>
            </div>
            <button type="button" class="btn-close-sidebar" id="btn-close-sidebar" aria-label="إغلاق السجل">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="bot-sidebar-actions">
            <button type="button" class="btn-new-chat-sidebar" id="btn-new-chat-sidebar">
                <i class="fa-solid fa-plus"></i>
                <span>محادثة جديدة</span>
            </button>
        </div>

        <div class="bot-sessions-list" id="bot-sessions-list">
            <!-- Dynamic session items inserted here -->
        </div>

        <div class="bot-sidebar-footer">
            <button type="button" class="btn-clear-all-chats" id="btn-clear-all-chats">
                <i class="fa-regular fa-trash-can"></i>
                <span>مسح كل المحادثات</span>
            </button>
        </div>
    </aside>

    <!-- Toast Notification -->
    <div id="toast-msg" class="toast-msg"></div>

    <script src="core/toast.js?v=59"></script>
    <script src="core/pwa.js?v=21"></script>
    <script src="features/bot/bot.js?v=15"></script>

</html>
