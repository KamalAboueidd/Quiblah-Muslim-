        /* Distance Card */
        .distance-card {
            background:rgba(0,0,0,0.55); backdrop-filter:blur(20px);
            border:1px solid rgba(197,168,89,0.3); border-top:4px solid var(--gold);
            border-radius:16px; padding:24px 30px; text-align:center;

        .distance-value { font-size:64px; font-weight:900; color:var(--gold); text-shadow:0 0 30px rgba(197,168,89,0.4); line-height:1; }

        .loc-pin { display:flex; align-items:center; gap:6px; }
        .dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
        .dot.user { background:var(--green); }
        .dot.kaaba { background:var(--gold); }

        /* Stats */
        .stats-row { display:flex; gap:12px; width:100%; max-width:500px; display:none; }
        .stat-card { flex:1; background:rgba(0,0,0,0.5); backdrop-filter:blur(15px); border:1px solid rgba(197,168,89,0.2); border-radius:12px; padding:14px 10px; text-align:center; }
        .stat-icon { font-size:20px; color:var(--gold); margin-bottom:6px; }

        #map { width:100%; height:320px; }

        @media (max-width:400px) { .distance-value { font-size:48px; } }

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="toast.js"></script>
<script src="pwa.js"></script>
<script>
    // Carousel
    const slides = document.querySelectorAll('.carousel-slide');
    let cur = 0;
    setInterval(() => { slides[cur].classList.remove('active'); cur = (cur+1)%slides.length; slides[cur].classList.add('active'); }, 8000);

    // Kaaba coordinates
    const KAABA = { lat: 21.4224779, lng: 39.8251832 };

    // Haversine distance in km
    function haversine(lat1, lon1, lat2, lon2) {
        const R = 6371, r = Math.PI/180;
        const dLat = (lat2-lat1)*r, dLon = (lon2-lon1)*r;
        const a = Math.sin(dLat/2)**2 + Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin(dLon/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // Animated number counter
    function animateNum(el, target) {
        const dur = 1400;
        const t0 = performance.now();
        function frame(now) {
            const p = Math.min((now-t0)/dur, 1);
            const e = 1 - (1-p)**3; // ease-out cubic
            el.textContent = Math.round(e * target).toLocaleString('ar-EG');
            if (p < 1) requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
    }

    // Main
    navigator.geolocation.getCurrentPosition(pos => {
        const { latitude: lat, longitude: lng } = pos.coords;
        const distKm = haversine(lat, lng, KAABA.lat, KAABA.lng);
        const distMiles = distKm * 0.621371;
        const fh = distKm / 850;
        const flH = Math.floor(fh), flM = Math.round((fh-flH)*60);

        // Show UI
        document.getElementById('loader').style.display = 'none';
        const card = document.getElementById('distance-card');
        const statsRow = document.getElementById('stats-row');
        const mapWrap = document.getElementById('map-wrapper');
        card.style.display = 'block';
        statsRow.style.display = 'flex';

        // Fill stats
        animateNum(document.getElementById('dist-km'), Math.round(distKm));
        document.getElementById('dist-miles').textContent = Math.round(distMiles).toLocaleString('ar-EG');
        document.getElementById('flight-time').textContent = flH > 0 ? `${flH}س ${flM}د` : `${flM}د`;

        // Qibla angle
        axios.get(`https://api.aladhan.com/v1/qibla/${lat}/${lng}`)
            .then(r => { document.getElementById('qibla-deg').textContent = Math.round(r.data.data.direction) + '°'; })
            .catch(() => {});

        // City name
        axios.get(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lng}&localityLanguage=ar`)
            .then(r => { const c = r.data.city || r.data.principalSubdivision || ''; if (c) document.getElementById('user-city').textContent = c; })
            .catch(() => {});

        // Map
        mapWrap.style.display = 'block';
        const map = L.map('map', { zoomControl: true, attributionControl: false })
            .setView([(lat+KAABA.lat)/2, (lng+KAABA.lng)/2], 4);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);

        // User dot
        L.marker([lat, lng], { icon: L.divIcon({
            className:'', iconSize:[16,16], iconAnchor:[8,8],
            html:`<div style="width:16px;height:16px;border-radius:50%;background:#1c9e5b;border:3px solid #fff;box-shadow:0 0 10px rgba(28,158,91,0.8);"></div>`
        })}).bindPopup('<b style="font-family:Tajawal;font-size:15px;">موقعك الحالي</b>').addTo(map);

        // Kaaba emoji
        L.marker([KAABA.lat, KAABA.lng], { icon: L.divIcon({
            className:'', iconSize:[34,34], iconAnchor:[17,30],
            html:`<div style="font-size:30px;line-height:1;filter:drop-shadow(0 0 8px rgba(197,168,89,0.9));">🕋</div>`
        })}).bindPopup('<b style="font-family:Tajawal;font-size:15px;">الكعبة المشرفة</b>').addTo(map);

        // Dashed gold line
        L.polyline([[lat, lng],[KAABA.lat, KAABA.lng]],
            { color:'#C5A859', weight:2, opacity:0.85, dashArray:'10 7' }
        ).addTo(map);

        map.fitBounds([[lat,lng],[KAABA.lat,KAABA.lng]], { padding:[40,40] });

    }, () => {
        document.getElementById('loader').innerHTML = `
            <i aria-hidden="true" class="fa-solid fa-triangle-exclamation fa-2x" style="color:#e74c3c;"></i>
            <div class="loader-text" style="color:#e74c3c;">تعذر الوصول لموقعك. تأكد من تفعيل خدمة الموقع.</div>`;
    }, { enableHighAccuracy: true, timeout: 15000 });
</script>
