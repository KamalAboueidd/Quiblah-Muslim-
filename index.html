    <!-- OneSignal Web Push SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "1927aef6-662e-4720-bc7b-99c243f78c8a",
          promptOptions: {
            slidedown: {
              prompts: [
                {
                  type: "push",
                  autoPrompt: true,
                  text: {
                    actionMessage: "هل ترغب في استقبال الأذكار اليومية ومواقيت الأذان وتذكيرات الصلاة على النبي ﷺ؟",
                    acceptButton: "تفعيل التنبيهات",
                    cancelButton: "لاحقاً"
                  },
                  delay: {
                    pageViews: 1,
                    timeDelay: 1
                  }
                }
              ]
            }
          }
        });

        // Trigger prompt automatically if not yet permitted
        try {
          if (!OneSignal.Notifications.permission) {
            await OneSignal.Slidedown.promptPush();
          }
        } catch (e) {
          console.log("OneSignal Slidedown prompt:", e);
        }
      });
    </script>

    <!-- OneSignal Golden Islamic Luxury Theme Overrides -->

      .onesignal-slidedown-container {

        direction: rtl !important;
        z-index: 2147483647 !important;
      }
      #onesignal-slidedown-dialog,
      .onesignal-slidedown-dialog {
        background: linear-gradient(145deg, #1d170f 0%, #110e08 100%) !important;
        border: 1.5px solid rgba(212, 175, 55, 0.7) !important;
        border-radius: 20px !important;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85), 0 0 35px rgba(212, 175, 55, 0.3) !important;
        backdrop-filter: blur(20px) !important;
        -webkit-backdrop-filter: blur(20px) !important;
        color: #f7eed7 !important;
        font-family: 'Tajawal', sans-serif !important;
        padding: 22px 24px !important;
      }
      #onesignal-slidedown-body,
      .onesignal-slidedown-body {
        background: transparent !important;
        color: #f7eed7 !important;
      }
      .onesignal-slidedown-body-message,
      #onesignal-slidedown-dialog p,
      #onesignal-slidedown-dialog span,
      .onesignal-slidedown-message {
        color: #f7eed7 !important;
        font-size: 15px !important;
        line-height: 1.65 !important;
        font-weight: 600 !important;
        font-family: 'Tajawal', sans-serif !important;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8) !important;
      }
      .onesignal-slidedown-body-icon,
      #onesignal-slidedown-dialog img,
      .onesignal-slidedown-dialog img {
        border-radius: 14px !important;
        border: 1.5px solid rgba(212, 175, 55, 0.6) !important;
        box-shadow: 0 0 18px rgba(212, 175, 55, 0.35) !important;
        background: rgba(212, 175, 55, 0.12) !important;
        padding: 3px !important;
      }
      #onesignal-slidedown-footer,
      .onesignal-slidedown-footer,
      .onesignal-slidedown-actions {
        background: transparent !important;
        border-top: 1px solid rgba(212, 175, 55, 0.2) !important;
        display: flex !important;
        gap: 12px !important;
        padding-top: 14px !important;
        margin-top: 14px !important;
      }
      #onesignal-slidedown-allow-button,
      .onesignal-slidedown-allow-button,
      button.onesignal-slidedown-allow-button {
        background: linear-gradient(135deg, #fde28e 0%, #d4af37 50%, #996515 100%) !important;
        color: #120e06 !important;
        font-weight: 800 !important;
        font-size: 14px !important;
        font-family: 'Tajawal', sans-serif !important;
        border-radius: 12px !important;
        border: 1px solid #ffe89e !important;
        box-shadow: 0 4px 16px rgba(212, 175, 55, 0.45) !important;
        cursor: pointer !important;
        padding: 9px 20px !important;
      }
      #onesignal-slidedown-allow-button:hover,
      .onesignal-slidedown-allow-button:hover {
        background: linear-gradient(135deg, #fff3ba 0%, #e6c556 50%, #b8860b 100%) !important;
        box-shadow: 0 6px 24px rgba(212, 175, 55, 0.75) !important;
        transform: translateY(-1.5px) !important;
      }
      #onesignal-slidedown-cancel-button,
      .onesignal-slidedown-cancel-button,
      button.onesignal-slidedown-cancel-button {

        font-family: 'Tajawal', sans-serif !important;

        color: #ffffff !important;
        border-color: #ffd978 !important;

      /* Hide Bell Widget Completely */
      #onesignal-bell-container,
      .onesignal-bell-container,
      #onesignal-bell-launcher,
      .onesignal-bell-launcher {
        display: none !important;

<body>

    <!-- Background Carousel -->
    <div class="fullscreen-carousel">
        <div class="carousel-slide active" style="background-image: url('assets/bg1.jpg');"></div>
        <div class="carousel-slide" style="background-image: url('assets/bg2.jpg');"></div>
        <div class="carousel-slide" style="background-image: url('assets/bg3.jpg');"></div>
        <div class="carousel-overlay"></div>
    </div>

    <!-- Navigation Progress Line -->
    <div id="nav-loading-bar"></div>

    <!-- Main Content Frame Container -->
    <div id="app-frame-container">
        <iframe id="app-frame" name="app-frame" src="home.html" title="قبلة المسلم" allow="geolocation; microphone; autoplay; clipboard-write;"></iframe>
    </div>

    <!-- Persistent Global Audio Player Bar -->
    <div class="global-player-bar" id="global-player-bar">
        <!-- Mobile Top Bar (Spotify style) -->
        <div class="mobile-player-top" id="mobile-player-top">
            <button class="mobile-expand-toggle" id="mobile-expand-toggle" onclick="togglePlayerExpand(event)" title="تصغير المشغل" aria-label="تصغير المشغل">
                <i class="fa-solid fa-chevron-down"></i>
            </button>
            <div class="mobile-header-title">مشغل القرآن الكريم</div>
            <button class="mobile-close-btn" id="mobile-close-btn" onclick="closePlayer(event)" title="إغلاق المشغل نهائياً" aria-label="إغلاق المشغل نهائياً">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- Track Info -->
        <div class="player-info-section" onclick="expandPlayerMobile()">
            <div class="player-thumb" id="player-thumb">
                <i class="fa-solid fa-book-quran"></i>
            </div>
            <div class="player-meta-wrap">
                <div class="player-titles">
                    <div class="player-track-title" id="player-surah-title">سورة الفاتحة</div>
                    <div class="player-artist-title" id="player-reciter-title">مشاري العفاسي</div>
                </div>
                <button class="player-fav-btn" id="player-fav-btn" onclick="toggleFavoriteSurah(event)" title="إضافة للمفضلة">
                    <i class="fa-regular fa-heart"></i>
                </button>
            </div>
        </div>

        <!-- Controls & Scrubber -->
        <div class="player-center-section">
            <div class="scrubber-row">
                <span id="time-current">0:00</span>
                <div class="scrubber-bar" id="scrubber-bar">
                    <div class="scrubber-fill" id="scrubber-fill"></div>
                    <div class="scrubber-thumb" id="scrubber-thumb"></div>
                </div>
                <span id="time-total">0:00</span>
            </div>

            <div class="player-buttons-row">
                <button class="ctrl-btn btn-extra btn-repeat" id="btn-repeat" title="تكرار السورة" onclick="toggleRepeat(event)">
                    <i class="fa-solid fa-repeat"></i>
                </button>
                <button class="ctrl-btn btn-skip-prev" id="btn-skip-prev" title="السورة السابقة" onclick="playPrevSurah(event)">
                    <i class="fa-solid fa-backward-step"></i>
                </button>
                <button class="ctrl-btn ctrl-btn-play" id="btn-play-pause" title="تشغيل / إيقاف" onclick="togglePlayPause(event)">
                    <i class="fa-solid fa-play"></i>
                </button>
                <button class="ctrl-btn btn-skip-next" id="btn-skip-next" title="السورة التالية" onclick="playNextSurah(event)">
                    <i class="fa-solid fa-forward-step"></i>
                </button>
                <button class="ctrl-btn btn-extra btn-speed" id="btn-speed" title="سرعة التلاوة" onclick="cyclePlaybackSpeed(event)">
                    <span id="speed-label">1x</span>
                </button>
            </div>
        </div>

        <!-- Right Section (Volume & Close) -->
        <div class="player-actions-section">
            <button class="ctrl-btn" id="btn-mute" title="كتم الصوت" onclick="toggleMute()">
                <i class="fa-solid fa-volume-high"></i>
            </button>
            <div class="volume-box">
                <div class="volume-bar" id="volume-bar">
                    <div class="volume-fill" id="volume-fill"></div>
                    <div class="volume-thumb" id="volume-thumb"></div>
                </div>
            </div>
            <button class="player-close-btn" title="إغلاق المشغل" onclick="closePlayer()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- Mobile Spotify Footer Actions -->
        <div class="mobile-player-footer">
            <button class="mobile-footer-btn" title="جودة الصوت"><i class="fa-solid fa-headphones"></i></button>
            <button class="mobile-footer-btn" onclick="shareCurrentSurah(event)" title="مشاركة السورة"><i class="fa-solid fa-share-nodes"></i></button>
            <button class="mobile-footer-btn" onclick="togglePlayerExpand(event)" title="إغلاق"><i class="fa-solid fa-list-ul"></i></button>
        </div>
    </div>

    <!-- The Single HTML5 Audio Element that plays continuously across all pages -->
    <audio id="global-quran-audio" preload="auto"></audio>

    <script src="core/toast.js?v=65"></script>
    <script src="features/landing/landing.js?v=65"></script>
    <script src="core/pwa.js"></script>
    <script src="core/reminders.js"></script>
</body>
</html>
