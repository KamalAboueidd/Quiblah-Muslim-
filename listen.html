<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الاستماع - قبلة المسلم</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="assets/mosque.svg">
    <style>
        :root {
            --gold: #C5A859;
            --white: #fff;
            --green: #1c9e5b;
            --dark: #000;
            --panel-bg: rgba(20, 20, 20, 0.85);
            --player-bg: #121212;
            --highlight: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Tajawal', sans-serif; background: #000; color: var(--white); overflow-x: hidden; min-height: 100vh; }
        
        .fullscreen-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; background: url('assets/bg1.jpg') center/cover; filter: brightness(0.3); }

        .app-container { position: relative; z-index: 10; min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 90px; }
        
        .top-bar { display: flex; justify-content: center; align-items: center; padding: 18px 30px 8px; }
        .top-bar .title { font-weight: 900; font-size: 28px; color: var(--white); text-shadow: 0 4px 15px rgba(0,0,0,0.8); }

        .nav-bar { display: flex; justify-content: center; gap: 10px; padding: 8px 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .nav-item { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 30px; background: rgba(0,0,0,0.4); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); color: white; text-decoration: none; font-weight: 700; font-size: 14px; transition: all 0.3s; }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.12); border-color: var(--gold); color: var(--gold); }

        /* Loader */
        .loader { display: none; text-align: center; color: var(--gold); margin: 40px; }
        
        /* Views */
        .view-section { display: none; width: 100%; max-width: 800px; margin: 0 auto; padding: 0 20px; }
        .view-section.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Reciters View */
        .search-box { width: 100%; padding: 12px 20px; border-radius: 30px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; font-family: 'Tajawal'; font-size: 15px; margin-bottom: 20px; outline: none; }
        .search-box::placeholder { color: rgba(255,255,255,0.5); }
        .search-box:focus { border-color: var(--gold); background: rgba(255,255,255,0.15); }
        
        .section-title { font-size: 18px; font-weight: 800; color: var(--gold); margin: 20px 0 15px; }
        
        .reciters-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; }
        .reciter-card { background: var(--panel-bg); border-radius: 12px; padding: 15px; text-align: center; cursor: pointer; transition: all 0.3s; border: 1px solid transparent; }
        .reciter-card:hover { background: var(--highlight); border-color: var(--gold); transform: translateY(-3px); }
        .reciter-icon { width: 70px; height: 70px; border-radius: 50%; background: linear-gradient(135deg, #1c9e5b, #116035); margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: var(--gold); box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .reciter-name { font-size: 13px; font-weight: 700; color: #fff; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* Surahs View */
        .back-btn { background: transparent; border: none; color: var(--gold); font-size: 16px; font-family: 'Tajawal'; cursor: pointer; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
        .reciter-header { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; }
        .reciter-header .reciter-icon { width: 90px; height: 90px; font-size: 32px; margin: 0; }
        .reciter-header h2 { font-size: 22px; font-weight: 900; }
        .reciter-header p { font-size: 13px; color: rgba(255,255,255,0.5); }
        
        .surah-list { display: flex; flex-direction: column; gap: 8px; }
        .surah-item { display: flex; align-items: center; padding: 12px 15px; background: rgba(255,255,255,0.03); border-radius: 8px; cursor: pointer; transition: all 0.2s; }
        .surah-item:hover { background: rgba(255,255,255,0.08); }
        .surah-item.playing { background: rgba(197, 168, 89, 0.15); border-right: 3px solid var(--gold); }
        .surah-num { width: 30px; font-size: 13px; color: rgba(255,255,255,0.5); text-align: center; font-weight: 700; }
        .surah-item.playing .surah-num { color: var(--gold); }
        .surah-name { flex-grow: 1; font-size: 15px; font-weight: 700; padding: 0 15px; }
        .surah-item.playing .surah-name { color: var(--gold); }
        .play-icon { font-size: 14px; color: rgba(255,255,255,0.3); }
        .surah-item:hover .play-icon { color: var(--white); }
        .surah-item.playing .play-icon { color: var(--gold); }

        /* Spotify-like Player (Bottom Bar) */
        .player-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #181818; border-top: 1px solid #282828; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; z-index: 100; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); box-shadow: 0 -5px 20px rgba(0,0,0,0.5); }
        .player-bar.visible { transform: translateY(0); }
        
        .player-info { display: flex; align-items: center; gap: 12px; width: 30%; min-width: 150px; }
        .player-thumb { width: 45px; height: 45px; border-radius: 4px; background: #282828; display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--gold); }
        .player-titles { display: flex; flex-direction: column; overflow: hidden; white-space: nowrap; }
        .player-track { font-size: 14px; font-weight: 700; color: #fff; text-overflow: ellipsis; overflow: hidden; }
        .player-artist { font-size: 12px; color: #a7a7a7; text-overflow: ellipsis; overflow: hidden; margin-top: 2px; }
        
        .player-controls-wrap { display: flex; flex-direction: column; align-items: center; width: 40%; max-width: 400px; }
        .player-buttons { display: flex; align-items: center; gap: 20px; margin-bottom: 8px; }
        .btn-ctrl { background: transparent; border: none; color: #a7a7a7; font-size: 18px; cursor: pointer; transition: color 0.2s; }
        .btn-ctrl:hover { color: #fff; }
        .btn-play { width: 32px; height: 32px; border-radius: 50%; background: #fff; color: #000; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: transform 0.2s; }
        .btn-play:hover { transform: scale(1.05); background: var(--gold); color: #fff; }
        
        .progress-container { display: flex; align-items: center; width: 100%; gap: 10px; font-size: 11px; color: #a7a7a7; }
        .progress-bar { flex-grow: 1; height: 4px; background: #4d4d4d; border-radius: 2px; cursor: pointer; position: relative; display: flex; align-items: center; }
        .progress-fill { height: 100%; background: var(--white); border-radius: 2px; width: 0%; pointer-events: none; transition: background 0.2s; }
        .progress-bar:hover .progress-fill { background: var(--gold); }
        .progress-thumb { width: 10px; height: 10px; background: #fff; border-radius: 50%; position: absolute; right: 0; top: 50%; transform: translate(50%, -50%); opacity: 0; box-shadow: 0 0 5px rgba(0,0,0,0.5); }
        .progress-bar:hover .progress-thumb { opacity: 1; }

        .player-actions { width: 30%; display: flex; justify-content: flex-end; align-items: center; gap: 10px; color: #a7a7a7; }
        .volume-container { display: flex; align-items: center; gap: 8px; width: 100px; }
        .volume-bar { flex-grow: 1; height: 4px; background: #4d4d4d; border-radius: 2px; cursor: pointer; position: relative; display: flex; align-items: center; }
        .volume-fill { height: 100%; background: var(--white); border-radius: 2px; width: 100%; pointer-events: none; transition: background 0.2s; }
        .volume-bar:hover .volume-fill { background: var(--gold); }
        .volume-thumb { width: 10px; height: 10px; background: #fff; border-radius: 50%; position: absolute; right: 100%; top: 50%; transform: translate(50%, -50%); opacity: 0; box-shadow: 0 0 5px rgba(0,0,0,0.5); }
        .volume-bar:hover .volume-thumb { opacity: 1; }

        .mobile-expand-btn { display: none; }

        @media (max-width: 768px) {
            .player-bar { padding: 8px 12px; cursor: pointer; }
            .player-info { width: 70%; }
            .player-controls-wrap { width: 30%; align-items: flex-end; }
            .progress-container, .player-actions, .btn-ctrl { display: none; } /* Hide extra controls on mobile mini player */
            .btn-play { width: 36px; height: 36px; font-size: 16px; margin-right: 5px; }
            
            /* Fullscreen mobile player mode */
            .player-bar.expanded { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: linear-gradient(to bottom, #2b302c, #121212); flex-direction: column; justify-content: flex-start; padding: 20px; z-index: 1000; cursor: default; }
            .player-bar.expanded .mobile-expand-btn { display: block; background: transparent; border: none; color: #fff; font-size: 24px; position: absolute; top: 20px; left: 20px; cursor: pointer; }
            .player-bar.expanded .player-info { width: 100%; flex-direction: column; text-align: center; margin-top: 80px; gap: 30px; }
            .player-bar.expanded .player-thumb { width: 250px; height: 250px; border-radius: 12px; font-size: 100px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
            .player-bar.expanded .player-titles { align-items: center; width: 100%; }
            .player-bar.expanded .player-track { font-size: 24px; font-weight: 800; white-space: normal; }
            .player-bar.expanded .player-artist { font-size: 16px; margin-top: 5px; }
            
            .player-bar.expanded .player-controls-wrap { width: 100%; max-width: 100%; margin-top: 40px; align-items: center; }
            .player-bar.expanded .progress-container { display: flex; margin-bottom: 25px; }
            .player-bar.expanded .player-actions { display: none; } /* Hide volume on mobile as OS controls it */
            .player-bar.expanded .player-buttons { width: 100%; justify-content: space-between; max-width: 250px; }
            .player-bar.expanded .btn-ctrl { display: block; font-size: 28px; color: #fff; }
            .player-bar.expanded .btn-play { width: 65px; height: 65px; font-size: 24px; background: var(--gold); }
        }
    </style>
</head>
<body>

<div class="fullscreen-bg"></div>

<div class="app-container">
    <div class="top-bar"><div class="title">قبلة المسلم</div></div>

    <div class="nav-bar">
        <a href="index.html" class="nav-item"><i class="fa-solid fa-clock"></i> المواقيت</a>
        <a href="quran.html" class="nav-item"><i class="fa-solid fa-book-quran"></i> المصحف</a>
        <a href="azkar.html?m=sm" class="nav-item"><i class="fa-solid fa-sun"></i> الصباح والمساء</a>
        <a href="azkar.html" class="nav-item"><i class="fa-solid fa-hands-praying"></i> الأذكار</a>
        <a href="qibla.html" class="nav-item"><i class="fa-solid fa-compass"></i> القبلة</a>
        <a href="distance.html" class="nav-item"><i class="fa-solid fa-route"></i> من بيتك للكعبة</a>
        <a href="listen.html" class="nav-item active"><i class="fa-solid fa-headphones"></i> الاستماع</a>
    </div>

    <!-- View: Reciters List -->
    <div class="view-section active" id="view-reciters">
        <input type="text" id="search-input" class="search-box" placeholder="ابحث عن قارئ...">
        
        <div id="loader-reciters" class="loader"><i class="fa-solid fa-spinner fa-spin fa-2x"></i><p style="margin-top:10px;">جاري تحميل القراء...</p></div>
        
        <div id="curated-container">
            <div class="section-title">قراء مختارون</div>
            <div class="reciters-grid" id="curated-grid"></div>
        </div>

        <div id="all-container" style="margin-top: 30px;">
            <div class="section-title">جميع القراء</div>
            <div class="reciters-grid" id="all-grid"></div>
        </div>
    </div>

    <!-- View: Surahs List -->
    <div class="view-section" id="view-surahs">
        <button class="back-btn" onclick="showReciters()"><i class="fa-solid fa-arrow-right"></i> عودة للقراء</button>
        <div class="reciter-header">
            <div class="reciter-icon"><i class="fa-solid fa-microphone-lines"></i></div>
            <div>
                <h2 id="current-reciter-name">اسم القارئ</h2>
                <p id="current-moshaf-name">الرواية</p>
            </div>
        </div>
        <div class="surah-list" id="surah-list"></div>
    </div>
</div>

<!-- Player Bar -->
<div class="player-bar" id="player-bar">
    <button class="mobile-expand-btn" onclick="togglePlayerExpand(event)"><i class="fa-solid fa-chevron-down"></i></button>
    <div class="player-info">
        <div class="player-thumb"><i class="fa-solid fa-book-quran"></i></div>
        <div class="player-titles">
            <div class="player-track" id="player-surah-name">---</div>
            <div class="player-artist" id="player-reciter-name">---</div>
        </div>
    </div>
    
    <div class="player-controls-wrap">
        <div class="player-buttons">
            <button class="btn-ctrl" onclick="playNext(event)" title="السورة التالية (للخلف)"><i class="fa-solid fa-backward-step"></i></button>
            <button class="btn-play" id="btn-play-pause" onclick="togglePlayPause(event)"><i class="fa-solid fa-play"></i></button>
            <button class="btn-ctrl" onclick="playPrev(event)" title="السورة السابقة (للأمام)"><i class="fa-solid fa-forward-step"></i></button>
        </div>
        <div class="progress-container">
            <span id="time-current">0:00</span>
            <div class="progress-bar" id="progress-bar" onclick="seek(event)">
                <div class="progress-fill" id="progress-fill"></div>
                <div class="progress-thumb" id="progress-thumb"></div>
            </div>
            <span id="time-total">0:00</span>
        </div>
    </div>
    
    <div class="player-actions">
        <div class="volume-container">
            <i class="fa-solid fa-volume-low" id="vol-icon" onclick="toggleMute(event)"></i>
            <div class="volume-bar" id="volume-bar" onclick="seekVolume(event)">
                <div class="volume-fill" id="volume-fill"></div>
                <div class="volume-thumb" id="volume-thumb"></div>
            </div>
        </div>
    </div>
</div>

<audio id="audio-player" style="display:none;"></audio>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="toast.js"></script>
<script>
    // 114 Surah Names
    const SURAH_NAMES = [
        "الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس",
        "هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه",
        "الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم",
        "لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر",
        "فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق",
        "الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة",
        "الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج",
        "نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس",
        "التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد",
        "الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات",
        "القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر",
        "المسد","الإخلاص","الفلق","الناس"
    ];

    // IDs of famous reciters to feature at the top (from API)
    // 92: Yasser Al Dosari, 51: Abdul Basit, 112: Minshawi, 118: Husary, 123: Mishary
    // 102: Maher, 86: Nasser Al Qatami, 5: Ahmed Al Ajmi, 30: Saad Al Ghamdi, 31: Saud Al Shuraim, 76: Ali Jaber, 106: Tablawi
    const CURATED_IDS = [92, 86, 5, 123, 102, 51, 112, 118, 30, 31, 76, 106]; 

    // Images for curated reciters (using tested working URLs only)
    const RECITER_IMAGES = {
        92: "https://tvquran.com/uploads/authors/images/%D9%8A%D8%A7%D8%B3%D8%B1%20%D8%A7%D9%84%D8%AF%D9%88%D8%B3%D8%B1%D9%8A.jpg", // Yasser Al Dosari
        118: "https://tvquran.com/uploads/authors/images/%D9%85%D8%AD%D9%85%D9%88%D8%AF%20%D8%AE%D9%84%D9%8A%D9%84%20%D8%A7%D9%84%D8%AD%D8%B5%D8%B1%D9%8A.jpg", // Husary
        123: "https://tvquran.com/uploads/authors/images/%D9%85%D8%B4%D8%A7%D8%B1%D9%8A%20%D8%A7%D9%84%D8%B9%D9%81%D8%A7%D8%B3%D9%8A.jpg", // Mishary
        102: "https://tvquran.com/uploads/authors/images/%D9%85%D8%A7%D9%87%D8%B1%20%D8%A7%D9%84%D9%85%D8%B9%D9%8A%D9%82%D9%84%D9%8A.jpg", // Maher
        86: "https://tvquran.com/uploads/authors/images/%D9%86%D8%A7%D8%B5%D8%B1%20%D8%A7%D9%84%D9%82%D8%B7%D8%A7%D9%85%D9%8A.jpg", // Nasser Al Qatami
        5: "https://tvquran.com/uploads/authors/images/%D8%A3%D8%AD%D9%85%D8%AF%20%D8%A8%D9%86%20%D8%B9%D9%84%D9%8A%20%D8%A7%D9%84%D8%B9%D8%AC%D9%85%D9%8A.jpg", // Ahmed Al Ajmi
        30: "https://tvquran.com/uploads/authors/images/%D8%B3%D8%B9%D8%AF%20%D8%A7%D9%84%D8%BA%D8%A7%D9%85%D8%AF%D9%8A.jpg", // Saad Al Ghamdi
        31: "https://tvquran.com/uploads/authors/images/%D8%B3%D8%B9%D9%88%D8%AF%20%D8%A7%D9%84%D8%B4%D8%B1%D9%8A%D9%85.jpg", // Saud Al Shuraim
        76: "https://tvquran.com/uploads/authors/images/%D8%B9%D9%84%D9%8A%20%D8%AC%D8%A7%D8%A8%D8%B1.jpg" // Ali Jaber
    };

    let allReciters = [];
    let currentServer = "";
    let currentReciterName = "";
    let currentSurahList = []; // array of int surah numbers
    let currentPlayingSurahNum = null;
    let isPlaying = false;

    const audio = document.getElementById('audio-player');
    const playPauseBtn = document.getElementById('btn-play-pause');

    window.addEventListener('DOMContentLoaded', () => {
        fetchReciters();
        
        // Mobile expand
        document.getElementById('player-bar').addEventListener('click', (e) => {
            if (window.innerWidth <= 768 && !e.target.closest('.btn-play') && !e.target.closest('.mobile-expand-btn') && !e.target.closest('.progress-bar')) {
                document.getElementById('player-bar').classList.add('expanded');
                document.body.style.overflow = 'hidden';
            }
        });

        // Search
        document.getElementById('search-input').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            renderReciters(query);
        });
    });

    function togglePlayerExpand(e) {
        e.stopPropagation();
        document.getElementById('player-bar').classList.remove('expanded');
        document.body.style.overflow = '';
    }

    function fetchReciters() {
        document.getElementById('loader-reciters').style.display = 'block';
        axios.get('https://www.mp3quran.net/api/v3/reciters?language=ar')
            .then(res => {
                allReciters = res.data.reciters;
                document.getElementById('loader-reciters').style.display = 'none';
                renderReciters();
            })
            .catch(err => {
                showToast('فشل في تحميل بيانات القراء', 'fa-solid fa-triangle-exclamation');
                document.getElementById('loader-reciters').style.display = 'none';
            });
    }

    function renderReciters(query = "") {
        const curatedGrid = document.getElementById('curated-grid');
        const allGrid = document.getElementById('all-grid');
        curatedGrid.innerHTML = "";
        allGrid.innerHTML = "";

        const curated = [];
        const others = [];

        allReciters.forEach(reciter => {
            if (query && !reciter.name.toLowerCase().includes(query)) return;
            if (CURATED_IDS.includes(reciter.id) && !query) curated.push(reciter);
            else others.push(reciter);
        });

        if (query) {
            document.getElementById('curated-container').style.display = 'none';
            others.forEach(r => allGrid.appendChild(createReciterCard(r)));
        } else {
            document.getElementById('curated-container').style.display = 'block';
            curated.forEach(r => curatedGrid.appendChild(createReciterCard(r)));
            others.forEach(r => allGrid.appendChild(createReciterCard(r)));
        }
    }

    function createReciterCard(reciter) {
        const div = document.createElement('div');
        div.className = 'reciter-card';
        
        // Use provided real image, or fallback to a generated avatar with their name
        const imgUrl = RECITER_IMAGES[reciter.id] || `https://ui-avatars.com/api/?name=${encodeURIComponent(reciter.name)}&background=116035&color=C5A859&size=150&font-size=0.33&bold=true`;
        
        const iconHtml = `<div class="reciter-icon" style="background-image: url('${imgUrl}'); background-size: cover; background-position: top center;"></div>`;

        div.innerHTML = `
            ${iconHtml}
            <div class="reciter-name">${reciter.name}</div>
        `;
        div.onclick = () => openReciter(reciter);
        return div;
    }

    function openReciter(reciter) {
        if (!reciter.moshaf || reciter.moshaf.length === 0) {
            showToast('لا توجد تلاوات متاحة لهذا القارئ حالياً', 'fa-solid fa-info-circle');
            return;
        }
        
        // Pick the first available moshaf
        const moshaf = reciter.moshaf[0];
        currentServer = moshaf.server;
        currentReciterName = reciter.name;
        currentSurahList = moshaf.surah_list.split(',').map(Number);

        document.getElementById('current-reciter-name').textContent = reciter.name;
        document.getElementById('current-moshaf-name').textContent = moshaf.name;
        
        const headerIcon = document.querySelector('.reciter-header .reciter-icon');
        const imgUrl = RECITER_IMAGES[reciter.id] || `https://ui-avatars.com/api/?name=${encodeURIComponent(reciter.name)}&background=116035&color=C5A859&size=150&font-size=0.33&bold=true`;
        
        headerIcon.style.backgroundImage = `url('${imgUrl}')`;
        headerIcon.style.backgroundSize = 'cover';
        headerIcon.style.backgroundPosition = 'top center';
        headerIcon.innerHTML = '';
        
        // Set player thumb image too
        const playerThumb = document.querySelector('.player-thumb');
        playerThumb.style.backgroundImage = `url('${imgUrl}')`;
        playerThumb.style.backgroundSize = 'cover';
        playerThumb.style.backgroundPosition = 'top center';
        playerThumb.innerHTML = '';

        renderSurahs();
        
        document.getElementById('view-reciters').classList.remove('active');
        document.getElementById('view-surahs').classList.add('active');
        window.scrollTo(0, 0);
    }

    function showReciters() {
        document.getElementById('view-surahs').classList.remove('active');
        document.getElementById('view-reciters').classList.add('active');
    }

    function renderSurahs() {
        const list = document.getElementById('surah-list');
        list.innerHTML = "";

        currentSurahList.forEach(num => {
            const item = document.createElement('div');
            item.className = 'surah-item';
            item.id = `surah-row-${num}`;
            if (currentPlayingSurahNum === num && currentReciterName === document.getElementById('player-reciter-name').textContent) {
                item.classList.add('playing');
            }
            
            const isPlayingThis = item.classList.contains('playing') && isPlaying;
            const playIconClass = isPlayingThis ? 'fa-pause' : 'fa-play';

            item.innerHTML = `
                <div class="surah-num">${num}</div>
                <div class="surah-name">سورة ${SURAH_NAMES[num - 1]}</div>
                <div class="play-icon"><i class="fa-solid ${playIconClass}"></i></div>
            `;
            
            item.onclick = () => playSurah(num, currentServer, currentReciterName);
            list.appendChild(item);
        });
    }

    // --- Audio Player Logic ---
    function formatTime(sec) {
        if (isNaN(sec)) return "0:00";
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${m}:${s.toString().padStart(2, '0')}`;
    }

    function playSurah(num, server, reciterName) {
        const numStr = String(num).padStart(3, '0');
        const serverUrl = server.endsWith('/') ? server : server + '/';
        const url = `${serverUrl}${numStr}.mp3`;
        
        if (currentPlayingSurahNum === num && currentReciterName === reciterName) {
            // Toggle play/pause if clicking the same surah
            togglePlayPause();
            // Also auto-expand on mobile if clicked again
            if (window.innerWidth <= 768) {
                document.getElementById('player-bar').classList.add('expanded');
                document.body.style.overflow = 'hidden';
            }
            return;
        }

        currentPlayingSurahNum = num;
        
        // Update Player UI
        document.getElementById('player-surah-name').textContent = `سورة ${SURAH_NAMES[num - 1]}`;
        document.getElementById('player-reciter-name').textContent = reciterName;
        document.getElementById('player-bar').classList.add('visible');
        
        // Reset progress
        document.getElementById('progress-fill').style.width = '0%';
        document.getElementById('progress-thumb').style.right = '100%';
        document.getElementById('time-current').textContent = '0:00';
        
        audio.src = url;
        audio.play().then(() => {
            isPlaying = true;
            updatePlayPauseIcon();
            updateSurahListUI();
            
            // Auto expand the player on mobile just like Spotify
            if (window.innerWidth <= 768) {
                document.getElementById('player-bar').classList.add('expanded');
                document.body.style.overflow = 'hidden';
            }
        }).catch(err => {
            showToast('حدث خطأ أثناء تشغيل السورة', 'fa-solid fa-triangle-exclamation');
        });
    }

    function togglePlayPause(e) {
        if (e) e.stopPropagation();
        if (!audio.src) return;
        if (isPlaying) {
            audio.pause();
            isPlaying = false;
        } else {
            audio.play();
            isPlaying = true;
        }
        updatePlayPauseIcon();
        updateSurahListUI();
    }

    function playNext(e) {
        if (e) e.stopPropagation();
        if (!currentSurahList.length || !currentPlayingSurahNum) return;
        const currentIndex = currentSurahList.indexOf(currentPlayingSurahNum);
        if (currentIndex < currentSurahList.length - 1) {
            playSurah(currentSurahList[currentIndex + 1], currentServer, currentReciterName);
        }
    }

    function playPrev(e) {
        if (e) e.stopPropagation();
        if (!currentSurahList.length || !currentPlayingSurahNum) return;
        const currentIndex = currentSurahList.indexOf(currentPlayingSurahNum);
        if (currentIndex > 0) {
            playSurah(currentSurahList[currentIndex - 1], currentServer, currentReciterName);
        }
    }

    function updatePlayPauseIcon() {
        playPauseBtn.innerHTML = isPlaying ? '<i class="fa-solid fa-pause"></i>' : '<i class="fa-solid fa-play"></i>';
        if (window.innerWidth <= 768 && document.getElementById('player-bar').classList.contains('expanded')) {
             playPauseBtn.innerHTML = isPlaying ? '<i class="fa-solid fa-pause"></i>' : '<i class="fa-solid fa-play"></i>';
        }
    }

    function updateSurahListUI() {
        document.querySelectorAll('.surah-item').forEach(el => {
            el.classList.remove('playing');
            el.querySelector('.play-icon i').className = 'fa-solid fa-play';
        });
        
        const activeRow = document.getElementById(`surah-row-${currentPlayingSurahNum}`);
        if (activeRow && currentReciterName === document.getElementById('current-reciter-name').textContent) {
            activeRow.classList.add('playing');
            activeRow.querySelector('.play-icon i').className = isPlaying ? 'fa-solid fa-pause' : 'fa-solid fa-play';
        }
    }

    audio.addEventListener('timeupdate', () => {
        const c = audio.currentTime;
        const d = audio.duration;
        if (d) {
            const pct = (c / d) * 100;
            // Since RTL, width expands from right to left
            document.getElementById('progress-fill').style.width = `${pct}%`;
            document.getElementById('progress-thumb').style.right = `${100 - pct}%`;
            document.getElementById('time-current').textContent = formatTime(c);
            document.getElementById('time-total').textContent = formatTime(d);
        }
    });

    audio.addEventListener('ended', () => playNext());

    function seek(e) {
        e.stopPropagation();
        if (!audio.duration) return;
        const bar = document.getElementById('progress-bar');
        const rect = bar.getBoundingClientRect();
        // RTL logic: x is from left, but progress is from right
        const clickX = e.clientX - rect.left;
        const pct = 1 - (clickX / rect.width); // inverted for RTL
        audio.currentTime = pct * audio.duration;
    }

    // --- Volume Control Logic ---
    let currentVolume = 1;
    function seekVolume(e) {
        e.stopPropagation();
        const bar = document.getElementById('volume-bar');
        const rect = bar.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        // RTL logic
        let pct = 1 - (clickX / rect.width);
        if (pct < 0) pct = 0;
        if (pct > 1) pct = 1;
        
        audio.volume = pct;
        currentVolume = pct;
        updateVolumeUI();
    }

    function toggleMute(e) {
        e.stopPropagation();
        if (audio.volume > 0) {
            audio.volume = 0;
        } else {
            audio.volume = currentVolume > 0 ? currentVolume : 1;
        }
        updateVolumeUI();
    }

    function updateVolumeUI() {
        const pct = audio.volume * 100;
        document.getElementById('volume-fill').style.width = `${pct}%`;
        document.getElementById('volume-thumb').style.right = `${100 - pct}%`;
        
        const icon = document.getElementById('vol-icon');
        if (audio.volume === 0) icon.className = 'fa-solid fa-volume-xmark';
        else if (audio.volume < 0.5) icon.className = 'fa-solid fa-volume-low';
        else icon.className = 'fa-solid fa-volume-high';
    }

    // Initialize volume UI
    updateVolumeUI();
</script>
</body>
</html>
