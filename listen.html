<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الاستماع - قبلة المسلم</title>

    <!-- SEO & Open Graph Tags -->
    <meta name="description" content="تطبيق قبلة المسلم: أوقات الصلاة الدقيقة، اتجاه القبلة، القرآن الكريم، الأذكار، وأسماء الله الحسنى في مكان واحد بتصميم عصري.">
    <meta name="keywords" content="صلاة, قبلة, قرآن, أذكار, أسماء الله الحسنى, أوقات الصلاة, مواقيت, مسلم">
    <meta name="author" content="كمال أبو عيد">
    <meta property="og:title" content="قبلة المسلم">
    <meta property="og:description" content="تطبيق قبلة المسلم: أوقات الصلاة الدقيقة، اتجاه القبلة، القرآن الكريم، الأذكار، وأسماء الله الحسنى.">
    <meta property="og:image" content="assets/bg1.jpg">
    <meta property="og:url" content="https://kamalaboueidd.github.io/Quiblah-Muslim-/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="قبلة المسلم">
    <meta name="twitter:description" content="تطبيق إسلامي شامل لأوقات الصلاة، القبلة، القرآن، والأذكار.">
    <link rel="preload" as="image" href="assets/bg1.jpg">

    <script src="core/player-bridge.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'" />
<noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" /></noscript>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="icon" type="image/svg+xml" href="assets/mosque.svg">
    
    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0d12">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="قبلة المسلم">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="stylesheet" href="features/listen/listen.css">
</head>
<body>

    <!-- Fullscreen Background Carousel -->
    <div class="fullscreen-carousel">
        <div class="carousel-slide active" style="background-image: url('assets/bg1.jpg');"></div>
        <div class="carousel-slide" style="background-image: url('assets/bg2.jpg');"></div>
        <div class="carousel-slide" style="background-image: url('assets/bg3.jpg');"></div>
        <div class="carousel-overlay"></div>
    </div>

<div class="app-container">
    <div class="top-bar">
        <a href="home.html" class="top-home-link" title="الصفحة الرئيسية"><i class="fa-solid fa-house"></i></a>
        <div class="title">مشغل القرآن الكريم</div>
        <div style="width: 40px;"></div>
    </div>

    <!-- View: Reciters List -->
    <div class="view-section active" id="view-reciters">
        <div class="reciters-search-row">
            <input type="text" id="search-input" class="search-box" placeholder="ابحث عن قارئ...">
            <button class="fav-action-btn" onclick="toggleFavoritesDrawer()" title="السور المفضلة">
                <div class="fav-btn-icon-wrap">
                    <i class="fa-solid fa-heart"></i>
                    <span class="fav-badge empty" id="fav-count-badge-rec">0</span>
                </div>
                <span class="fav-btn-label">المفضلة</span>
            </button>
        </div>
        
        <div id="loader-reciters" class="loader"><i aria-hidden="true" class="fa-solid fa-spinner fa-spin fa-2x"></i><p style="margin-top:10px;">جاري تحميل القراء...</p></div>
        
        <div id="curated-container">
            <div class="section-title">قراء مختارون</div>
            <div class="reciters-grid" id="curated-grid"></div>
        </div>

        <div id="all-container" style="margin-top: 30px;">
            <div class="section-title">جميع القراء</div>
            <div class="reciters-grid" id="all-grid"></div>
        </div>
    </div>

    <!-- View: Surahs List (Spotify Desktop Layout) -->
    <div class="view-section" id="view-surahs">
        <div class="surahs-top-actions">
            <button class="back-btn" onclick="showReciters()" title="العودة لاختيار قارئ">
                <i aria-hidden="true" class="fa-solid fa-arrow-right"></i>
                <span>عودة للقراء</span>
            </button>
            <button class="fav-action-btn" onclick="toggleFavoritesDrawer()" title="السور المفضلة">
                <div class="fav-btn-icon-wrap">
                    <i class="fa-solid fa-heart"></i>
                    <span class="fav-badge empty" id="fav-count-badge">0</span>
                </div>
                <span class="fav-btn-label">المفضلة</span>
            </button>
        </div>
        
        <!-- Spotify Hero Banner -->
        <div class="spotify-hero-banner" id="spotify-hero-banner">
            <div class="spotify-hero-avatar" id="spotify-hero-avatar"></div>
            <div class="spotify-hero-info">
                <span class="spotify-hero-badge"><i class="fa-solid fa-circle-check"></i> قارئ معتمد</span>
                <h1 class="spotify-hero-name" id="current-reciter-name">اسم القارئ</h1>
                <p class="spotify-hero-sub" id="current-moshaf-name">الرواية والمصحف</p>
            </div>
            <button class="spotify-big-play-btn" id="hero-play-btn" onclick="playFirstSurah()" title="تشغيل التلاوات">
                <i class="fa-solid fa-play"></i>
            </button>
        </div>

        <!-- Spotify Content Layout: Main List & Right Side Panel -->
        <div class="spotify-content-layout">
            <div class="spotify-main-col">
                <div class="section-title">السور والتلاوات المتاحة</div>
                <div class="surah-list" id="surah-list"></div>
            </div>
            <div class="spotify-side-panel" id="spotify-side-panel">
                <div class="side-panel-header">
                    <h3 id="side-reciter-name">اسم القارئ</h3>
                </div>
                <div class="side-panel-card">
                    <div class="side-panel-art" id="side-panel-art"></div>
                    <div class="side-panel-info">
                        <h4 class="side-track-title" id="side-track-title">اختر سورة للاستماع</h4>
                        <p class="side-reciter-title" id="side-reciter-title">اسم القارئ</p>
                    </div>
                </div>
            </div>
        </div>
</div>

<!-- Favorites Drawer / Bottom Sheet Modal -->
<div class="favorites-drawer-overlay" id="fav-drawer-overlay" onclick="closeFavoritesDrawer(event)">
    <div class="favorites-drawer" id="favorites-drawer" onclick="event.stopPropagation()">
        <div class="fav-drawer-header">
            <div class="fav-drawer-title-wrap">
                <i class="fa-solid fa-heart fav-header-heart"></i>
                <h3>السور المفضلة</h3>
                <span class="fav-total-count" id="fav-total-count">0 سورة</span>
            </div>
            <button class="fav-drawer-close-btn" onclick="closeFavoritesDrawer(event)" title="إغلاق">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="fav-drawer-body" id="fav-drawer-body">
            <!-- Dynamically populated or empty state -->
        </div>
    </div>
</div>

<!-- Player Bar (Spotify Style) -->
<div class="player-bar" id="player-bar">
    <!-- Mobile Top Bar (Spotify style) -->
    <div class="mobile-player-top" id="mobile-player-top">
        <button class="mobile-expand-btn" onclick="togglePlayerExpand(event)" title="تصغير المشغل">
            <i class="fa-solid fa-chevron-down"></i>
        </button>
        <div class="mobile-header-title">مشغل القرآن الكريم</div>
        <button class="mobile-top-opt" onclick="shareCurrentSurah(event)" title="مشاركة">
            <i class="fa-solid fa-ellipsis-vertical"></i>
        </button>
    </div>

    <div class="player-info" onclick="expandPlayerMobile()">
        <div class="player-thumb" id="player-thumb"><i aria-hidden="true" class="fa-solid fa-book-quran"></i></div>
        <div class="player-meta-wrap">
            <div class="player-titles">
                <div class="player-track" id="player-surah-name">---</div>
                <div class="player-artist" id="player-reciter-name">---</div>
            </div>
            <button class="player-fav-btn" id="player-fav-btn" onclick="toggleFavoriteSurah(event)" title="إضافة للمفضلة">
                <i class="fa-regular fa-heart"></i>
            </button>
        </div>
    </div>
    
    <div class="player-controls-wrap">
        <div class="progress-container">
            <span id="time-current">0:00</span>
            <div class="progress-bar" id="progress-bar" onclick="seek(event)" title="اسحب أو اضغط للتقديم والتأخير">
                <div class="progress-fill" id="progress-fill"></div>
                <div class="progress-thumb" id="progress-thumb"></div>
            </div>
            <span id="time-total" title="اضغط للتبديل بين الوقت المتبقي والكلي">-0:00</span>
        </div>
        <div class="player-buttons">
            <button class="btn-ctrl btn-extra btn-repeat" id="btn-repeat" onclick="toggleRepeat(event)" title="تكرار السورة"><i class="fa-solid fa-repeat"></i></button>
            <button class="btn-ctrl" onclick="playNext(event)" title="السورة التالية (للخلف)"><i aria-hidden="true" class="fa-solid fa-backward-step"></i></button>
            <button class="btn-play" id="btn-play-pause" onclick="togglePlayPause(event)"><i aria-hidden="true" class="fa-solid fa-play"></i></button>
            <button class="btn-ctrl" onclick="playPrev(event)" title="السورة السابقة (للأمام)"><i aria-hidden="true" class="fa-solid fa-forward-step"></i></button>
            <button class="btn-ctrl btn-extra btn-speed" id="btn-speed" onclick="cyclePlaybackSpeed(event)" title="سرعة التلاوة"><span id="speed-label">1x</span></button>
        </div>
    </div>
    
    <div class="player-actions">
        <div class="volume-container">
            <i aria-hidden="true" class="fa-solid fa-volume-low" id="vol-icon" onclick="toggleMute(event)"></i>
            <div class="volume-bar" id="volume-bar" onclick="seekVolume(event)">
                <div class="volume-fill" id="volume-fill"></div>
                <div class="volume-thumb" id="volume-thumb"></div>
            </div>
        </div>
    </div>

    <!-- Mobile Spotify Footer Actions -->
    <div class="mobile-player-footer">
        <button class="mobile-footer-btn" title="جودة الصوت"><i class="fa-solid fa-headphones"></i></button>
        <button class="mobile-footer-btn" onclick="shareCurrentSurah(event)" title="مشاركة السورة"><i class="fa-solid fa-share-nodes"></i></button>
        <button class="mobile-footer-btn" onclick="togglePlayerExpand(event)" title="إغلاق"><i class="fa-solid fa-list-ul"></i></button>
    </div>
</div>

<audio id="audio-player" style="display:none;"></audio>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="core/toast.js"></script>
<script src="core/pwa.js"></script>
<script src="features/listen/listen.js"></script>
</body>
</html>
