<body>

<div class="fullscreen-bg"></div>

<div class="app-container">
    <div class="top-bar"><div class="title">قبلة المسلم</div></div>

    <div class="nav-bar">
        <a href="home.html" class="nav-item"><i aria-hidden="true" class="fa-solid fa-clock"></i> المواقيت</a>
        <a href="reminders.html" class="nav-item"><i aria-hidden="true" class="fa-solid fa-bell"></i> التذكيرات</a>
        <a href="quran.html" class="nav-item"><i aria-hidden="true" class="fa-solid fa-book-quran"></i> المصحف</a>
        <a href="tafseer.html" class="nav-item"><i aria-hidden="true" class="fa-solid fa-book-open-reader"></i> التفسير</a>
        <a href="azkar.html?m=sm" class="nav-item"><i aria-hidden="true" class="fa-solid fa-sun"></i> الصباح والمساء</a>
        <a href="azkar.html" class="nav-item"><i aria-hidden="true" class="fa-solid fa-hands-praying"></i> الأذكار</a>
        <a href="names.html" class="nav-item"><i aria-hidden="true" class="fa-solid fa-list-ol"></i> أسماء الله</a>
        <a href="qibla.html" class="nav-item"><i aria-hidden="true" class="fa-solid fa-compass"></i> القبلة</a>
        <a href="distance.html" class="nav-item"><i aria-hidden="true" class="fa-solid fa-route"></i> من بيتك للكعبة</a>
        <a href="listen.html" class="nav-item active"><i aria-hidden="true" class="fa-solid fa-headphones"></i> الاستماع</a>
        <a href="mosques.html" class="nav-item"><i aria-hidden="true" class="fa-solid fa-mosque"></i> أقرب مسجد</a>
    </div>

    <!-- View: Reciters List -->
    <div class="view-section active" id="view-reciters">
        <input type="text" id="search-input" class="search-box" placeholder="ابحث عن قارئ...">
        
        <div id="loader-reciters" class="loader"><i aria-hidden="true" class="fa-solid fa-spinner fa-spin fa-2x"></i><p style="margin-top:10px;">جاري تحميل القراء...</p></div>
        
        <div id="curated-container">
            <div class="section-title">قراء مختارون</div>
            <div class="reciters-grid" id="curated-grid"></div>
        </div>

        <div id="all-container" style="margin-top: 30px;">
            <div class="section-title">جميع القراء</div>
            <div class="reciters-grid" id="all-grid"></div>
        </div>
    </div>

    <!-- View: Surahs List -->
    <div class="view-section" id="view-surahs">
        <button class="back-btn" onclick="showReciters()"><i aria-hidden="true" class="fa-solid fa-arrow-right"></i> عودة للقراء</button>
        <div class="reciter-header">
            <div class="reciter-icon"><i aria-hidden="true" class="fa-solid fa-microphone-lines"></i></div>
            <div>
                <h2 id="current-reciter-name">اسم القارئ</h2>
                <p id="current-moshaf-name">الرواية</p>
            </div>
        </div>
        <div class="surah-list" id="surah-list"></div>
    </div>
</div>

<!-- Player Bar -->
<div class="player-bar" id="player-bar">
    <button class="mobile-expand-btn" onclick="togglePlayerExpand(event)"><i aria-hidden="true" class="fa-solid fa-chevron-down"></i></button>
    <div class="player-info">
        <div class="player-thumb"><i aria-hidden="true" class="fa-solid fa-book-quran"></i></div>
        <div class="player-titles">
            <div class="player-track" id="player-surah-name">---</div>
            <div class="player-artist" id="player-reciter-name">---</div>
        </div>
    </div>
    
    <div class="player-controls-wrap">
        <div class="player-buttons">
            <button class="btn-ctrl" onclick="playNext(event)" title="السورة التالية (للخلف)"><i aria-hidden="true" class="fa-solid fa-backward-step"></i></button>
            <button class="btn-play" id="btn-play-pause" onclick="togglePlayPause(event)"><i aria-hidden="true" class="fa-solid fa-play"></i></button>
            <button class="btn-ctrl" onclick="playPrev(event)" title="السورة السابقة (للأمام)"><i aria-hidden="true" class="fa-solid fa-forward-step"></i></button>
        </div>
        <div class="progress-container">
            <span id="time-current">0:00</span>
            <div class="progress-bar" id="progress-bar" onclick="seek(event)">
                <div class="progress-fill" id="progress-fill"></div>
                <div class="progress-thumb" id="progress-thumb"></div>
            </div>
            <span id="time-total">0:00</span>
        </div>
    </div>
    
    <div class="player-actions">
        <div class="volume-container">
            <i aria-hidden="true" class="fa-solid fa-volume-low" id="vol-icon" onclick="toggleMute(event)"></i>
            <div class="volume-bar" id="volume-bar" onclick="seekVolume(event)">
                <div class="volume-fill" id="volume-fill"></div>
                <div class="volume-thumb" id="volume-thumb"></div>
            </div>
        </div>
    </div>
</div>

<audio id="audio-player" style="display:none;"></audio>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="core/toast.js"></script>
<script src="core/pwa.js"></script>
<script src="features/listen/listen.js"></script>
</body>
</html>
