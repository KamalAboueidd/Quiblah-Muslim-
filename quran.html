<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />

    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" /></noscript>

    <link rel="manifest" href="manifest.json">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-title" content="قبلة المسلم">

    <style>
        :root {
            --primary-teal: #2F7A78;
            --gold: #C5A859;
            --white: #FFFFFF;
        }

        body {
            font-family: "Tajawal", sans-serif;
            margin: 0;
            padding: 0;
            background-color: #111;
            color: var(--white);
            overflow: hidden; 
            height: 100dvh;
        }

        /* --- Fullscreen Background Carousel (Same as index.html) --- */
        .fullscreen-carousel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        .carousel-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }
        .carousel-slide.active { opacity: 1; }
        .carousel-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7); 
            backdrop-filter: blur(5px);
        }

        /* --- App Layout --- */
        .app-layout {
            display: flex;
            height: 100dvh;
            width: 100%;
            position: relative;
            z-index: 10;
        }
        
        /* Reader Top Navigation Bar - Borderless & Backgroundless */
        .reader-top-bar {
            max-width: 950px;
            width: 100%;
            margin: 0 auto 12px auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 4px 6px;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            flex-shrink: 0;
            box-sizing: border-box;
        }

        .nav-right-cluster {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            white-space: nowrap !important;
            flex-shrink: 0;
        }

        .menu-btn {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            color: var(--gold);
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            padding: 4px 6px;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-family: inherit;
            white-space: nowrap !important;
            transition: color 0.2s ease, opacity 0.2s ease;
        }

        .menu-btn:hover {
            color: #ffffff;
            opacity: 0.9;
            background: transparent !important;
            border: none !important;
        }

        .menu-btn i {
            font-size: 15px;
        }

        .header-page-title {
            font-size: 14.5px;
            font-weight: 800;
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            white-space: nowrap !important;
        }

        .header-page-title i {
            color: var(--gold);
            font-size: 15px;
        }

        .back-home-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 4px 6px;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            color: var(--gold);
            text-decoration: none;
            font-weight: 800;
            font-size: 14px;
            font-family: inherit;
            white-space: nowrap !important;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .back-home-btn:hover {
            color: #ffffff;
            background: transparent !important;
            border: none !important;
        }

        .back-home-btn i {
            font-size: 14px;
            transition: transform 0.2s ease;
        }

        .back-home-btn:hover i {
            transform: translateX(3px);
        }

        /* --- Sidebar --- */
        .sidebar {
            width: 320px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .search-box {
            position: relative;
            width: 100%;
        }
        
        .search-box input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 14px 15px 14px 45px;
            border-radius: 12px;
            outline: none;
            font-family: inherit;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .search-box input:focus { border-color: var(--gold); }
        .search-box input::placeholder { color: rgba(255,255,255,0.4); }
        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.4);
        }

        .surah-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px 10px;
        }

        .surah-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            margin-bottom: 5px;
            gap: 12px;
        }
        
        .surah-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .surah-item.active {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid var(--gold);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .surah-number {
            width: 32px;
            height: 32px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: var(--gold);
            font-size: 14px;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .surah-item.active .surah-number {
            background: var(--gold);
            color: #111;
        }

        .surah-details {
            flex: 1;
        }

        .surah-name { font-weight: 900; font-size: 15px; color: white; margin-bottom: 2px;}
        .surah-info { font-size: 11px; color: #aaa; font-weight: 500;}

        /* --- Main Content --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .mobile-header {
            display: none;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            align-items: center;
            justify-content: space-between;
            z-index: 50;
        }
        


        .reader-area {
            flex: 1;
            overflow-y: auto;
            padding: 30px 40px 60px;
            scroll-behavior: smooth;
        }

        .surah-header-card {
            padding: 20px 20px 10px 20px;
            text-align: center;
            margin: 0 auto 35px auto;
            max-width: 650px;
            background: transparent;
        }

        .surah-title {
            font-family: 'Amiri Quran', serif;
            font-size: 54px;
            color: var(--gold);
            margin: 0 0 28px 0; /* Significant breathing room beneath the title */
            text-shadow: 0 2px 14px rgba(0, 0, 0, 0.95);
            line-height: 1.35;
        }

        .surah-meta {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 28px;
            color: #ddd;
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 26px; /* Breathing room beneath meta details */
        }

        .bismillah {
            text-align: center;
            font-family: 'Amiri Quran', serif;
            font-size: 34px;
            margin: 20px auto 40px auto;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .verses-container {
            max-width: 1000px;
            margin: 0 auto;
            text-align: justify;
            direction: rtl;
            line-height: 2.8;
            padding-bottom: 100px;
            min-height: 100vh;
        }

        .verse {
            font-family: 'Amiri Quran', serif;
            font-size: 34px;
            color: white;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }

        .verse-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            margin: 0 5px;
            border-radius: 50%;
            border: 1.5px solid var(--gold);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            color: var(--gold);
            font-family: "Tajawal", sans-serif;
            font-size: 11px;
            font-weight: 800;
            vertical-align: middle;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .verse-number:hover {
            background: var(--gold);
            color: #111;
            transform: scale(1.15);
            box-shadow: 0 0 10px rgba(197, 168, 89, 0.6);
        }

        /* Sadaqallah Al-Azeem */
        .sadaqallah-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 45px auto 25px auto;
            text-align: center;
            width: 100%;
            max-width: 600px;
        }

        .sadaqallah-text {
            font-family: 'Amiri Quran', serif;
            font-size: 32px;
            color: var(--gold);
            text-shadow: 0 2px 12px rgba(197, 168, 89, 0.4);
            white-space: nowrap;
            letter-spacing: 1px;
        }

        .sadaqallah-line {
            height: 1.5px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            flex: 1;
            max-width: 120px;
        }

        /* Quick Tafseer Modal */
        .tafseer-modal-backdrop {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .tafseer-modal-backdrop.show {
            display: flex;
            opacity: 1;
        }

        .tafseer-modal-card {
            background: rgba(20, 24, 30, 0.95);
            border: 1px solid var(--gold);
            border-radius: 20px;
            max-width: 650px;
            width: 100%;
            padding: 26px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 25px rgba(197, 168, 89, 0.2);
            direction: rtl;
            transform: translateY(20px);
            transition: transform 0.3s ease;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }

        .tafseer-modal-backdrop.show .tafseer-modal-card {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 15px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--gold);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-close-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            transition: all 0.2s;
        }

        .modal-close-btn:hover {
            background: rgba(239, 68, 68, 0.8);
            color: white;
        }

        .modal-body {
            overflow-y: auto;
            flex: 1;
            padding-left: 5px;
        }

        .modal-ayah-text {
            font-family: 'Amiri Quran', serif;
            font-size: 24px;
            line-height: 2;
            color: var(--gold);
            text-align: center;
            margin-bottom: 18px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            border: 1px solid rgba(197, 168, 89, 0.2);
        }

        .modal-tafseer-text {
            font-size: 16px;
            line-height: 1.9;
            color: #f1f5f9;
            text-align: justify;
        }

        .modal-footer {
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        /* Scrollbars */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 4px; }

        /* Loaders & Errors */
        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 60vh;
            color: var(--gold);
            gap: 15px;
            font-size: 20px;
            font-weight: 800;
        }
        
        .error-message {
            color: #ef4444;
            text-align: center;
            padding: 40px;
            font-size: 20px;
            font-weight: 800;
        }

        /* Overlay for mobile sidebar */
        .sidebar-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 90;
            opacity: 0;
            transition: opacity 0.3s;
        }

        /* --- Responsive --- */
        @media (max-width: 900px) {
            .nav-bar { gap: 10px; padding: 10px; }
            .nav-item { padding: 8px 12px; font-size: 13px; }
            
            .sidebar {
                position: absolute;
                right: 0;
                top: 0;
                height: 100%;
                z-index: 100;
                transform: translateX(100%);
            }
            .sidebar.open {
                transform: translateX(0);
                box-shadow: -10px 0 30px rgba(0,0,0,0.8);
            }
            .sidebar-overlay.active {
                display: block;
                opacity: 1;
            }

            .reader-top-bar { margin-bottom: 8px; padding: 2px 2px; }
            .menu-btn { font-size: 13px; gap: 5px; }
            .header-page-title { font-size: 13px; gap: 5px; }
            .back-home-btn { font-size: 13px; gap: 5px; }
            .nav-right-cluster { gap: 10px; }

            .reader-area { padding: 16px 14px 40px; }
            .surah-header-card { padding: 15px 10px; margin-bottom: 25px; }
            .surah-title { font-size: 38px; margin-bottom: 20px; }
            .surah-meta { font-size: 14px; gap: 18px; margin-bottom: 20px; }
            .bismillah { font-size: 26px; margin: 15px auto 25px auto; }
            
            .verses-container { line-height: 2.3; }
            .verse { font-size: 24px; }
            .verse-number { width: 22px; height: 22px; font-size: 10px; margin: 0 3px; border-width: 1px; }
            .sadaqallah-text { font-size: 24px; }
            .sadaqallah-line { max-width: 60px; }
            .sadaqallah-box { margin: 30px auto 15px auto; }
        }

        /* Desktop Tweaks */
        @media (min-width: 900px) {
            .sidebar { width: 300px; }
            .reader-area { padding: 25px 40px 60px; }
            
            .surah-header-card { padding: 20px 20px 10px 20px; margin: 0 auto 35px auto; max-width: 650px; }
            .surah-title { font-size: 54px; margin: 0 0 28px 0; }
            .surah-meta { font-size: 16px; gap: 28px; margin-bottom: 26px; }
            .bismillah { font-size: 34px; margin: 20px auto 40px auto; }
            
            .verses-container { max-width: 950px; padding: 0 20px; line-height: 2.5; }
            .verse { font-size: 30px; }
            .verse-number { width: 26px; height: 26px; font-size: 11px; margin: 0 5px; }
        }
    </style>
</head>
<body>

    <!-- Fullscreen Background Carousel -->
    <div class="fullscreen-carousel">
        <div class="carousel-slide active" style="background-image: url('assets/bg1.jpg');"></div>
        <div class="carousel-slide" style="background-image: url('assets/bg2.jpg');"></div>
        <div class="carousel-slide" style="background-image: url('assets/bg3.jpg');"></div>
        <div class="carousel-overlay"></div>
    </div>

    <!-- Layout -->
    <div class="app-layout">
        
        <!-- Sidebar Overlay (Mobile) -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="search-box">
                    <i aria-hidden="true" class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-input" placeholder="ابحث عن سورة..." />
                </div>
            </div>
            <div class="surah-list" id="surah-list">
                <!-- Surahs injected here -->
                <div style="text-align: center; color: var(--gold); padding: 20px;">
                    <i aria-hidden="true" class="fa-solid fa-spinner fa-spin fa-2x"></i>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            
            <!-- Reader Area -->
            <div class="reader-area" id="reader-area">
                <!-- Top Navigation & Action Row (Borderless, Backgroundless, Straight) -->
                <div class="reader-top-bar">
                    <div class="nav-right-cluster">
                        <button type="button" class="menu-btn" id="menu-btn" aria-label="فتح قائمة السور">
                            <i class="fa-solid fa-bars"></i>
                            <span>قائمة السور</span>
                        </button>
                        <span class="header-page-title" id="mobile-title">
                            <i class="fa-solid fa-book-quran"></i>
                            <span>القرآن الكريم</span>
                        </span>
                    </div>
                    <a href="home.html" class="back-home-btn" title="الرجوع لصفحة المواقيت الرئيسية">
                        <i class="fa-solid fa-arrow-right"></i>
                        <span>الرجوع للمواقيت</span>
                    </a>
                </div>

                <div id="content-container">
                    <!-- Default State -->
                    <div class="loader-container" style="height: 80vh;">
                        <i aria-hidden="true" class="fa-solid fa-book-open fa-3x" style="margin-bottom: 15px; opacity: 0.5;"></i>
                        <p style="opacity: 0.7;">اختر سورة من القائمة للقراءة</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Quick Tafseer Modal -->
    <div class="tafseer-modal-backdrop" id="tafseer-modal-backdrop">
        <div class="tafseer-modal-card">
            <div class="modal-header">
                <div class="modal-title" id="modal-title"><i class="fa-solid fa-book-open-reader"></i> تفسير الآية</div>
                <button class="modal-close-btn" id="modal-close-btn" title="إغلاق"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <div class="modal-ayah-text" id="modal-ayah-text"></div>
                <div style="font-weight: 800; color: var(--gold); margin-bottom: 8px; font-size: 14px;">
                    <i class="fa-solid fa-book-open"></i> التفسير الميسر:
                </div>
                <div class="modal-tafseer-text" id="modal-tafseer-text"></div>
            </div>
            <div class="modal-footer">
                <a id="modal-full-link" href="tafseer.html" style="border: 1px solid var(--gold); background: rgba(197, 168, 89, 0.15); color: var(--gold); text-decoration: none; padding: 8px 18px; border-radius: 20px; display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 700;">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i> عرض في صفحة التفسير الشاملة
                </a>
            </div>
        </div>
    </div>

    <script src="surahs_meta.js"></script>
    <script src="quran_data.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        // Header Carousel Logic
        const slides = document.querySelectorAll('.carousel-slide');
        let currentSlide = 0;
        setInterval(() => {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }, 8000);

        // Sidebar Mobile Toggle
        const sidebar = document.getElementById('sidebar');
        const menuBtn = document.getElementById('menu-btn');
        const overlay = document.getElementById('sidebar-overlay');
        
        function toggleSidebar() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        menuBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            toggleSidebar();
        });
        overlay.addEventListener('click', toggleSidebar);

        // API Integration
        let allSurahs = [];
        let currentSurahNumber = 1;

        const surahListEl = document.getElementById('surah-list');
        const searchInput = document.getElementById('search-input');
        const contentContainer = document.getElementById('content-container');
        const readerArea = document.getElementById('reader-area');
        const mobileTitle = document.getElementById('mobile-title');

        // Fetch All Surahs (with Instant Local Cache & Multi-tier Fallback)
        function fetchSurahs() {
            // 1. Instant local metadata (0ms load guaranteed, works offline)
            if (window.QURAN_SURAHS_DATA && window.QURAN_SURAHS_DATA.length > 0) {
                allSurahs = window.QURAN_SURAHS_DATA;
                renderSurahList(allSurahs);
                return;
            }

            if (window.QURAN_FULL_DATA) {
                allSurahs = Object.values(window.QURAN_FULL_DATA).map(s => ({
                    number: s.number,
                    name: s.name,
                    englishName: s.englishName,
                    revelationType: s.revelationType,
                    numberOfAyahs: s.numberOfAyahs
                }));
                renderSurahList(allSurahs);
                return;
            }

            const cachedIndex = localStorage.getItem('quiblah_surah_index');
            if (cachedIndex) {
                try {
                    allSurahs = JSON.parse(cachedIndex);
                    renderSurahList(allSurahs);
                    return;
                } catch(e) {
                    localStorage.removeItem('quiblah_surah_index');
                }
            }

            fetchWithTimeout('https://api.alquran.cloud/v1/surah', 6000)
                .then(response => {
                    allSurahs = response.data;
                    try { localStorage.setItem('quiblah_surah_index', JSON.stringify(allSurahs)); } catch(e){}
                    renderSurahList(allSurahs);
                })
                .catch(error => {
                    console.warn("Alquran API surah list failed, trying Quran.com API...", error);
                    fetchWithTimeout('https://api.quran.com/api/v4/chapters?language=ar', 6000)
                        .then(r2 => {
                            allSurahs = r2.chapters.map(c => ({
                                number: c.id,
                                name: c.name_arabic,
                                englishName: c.name_simple,
                                revelationType: c.revelation_place === 'makkah' ? 'Meccan' : 'Medinan',
                                numberOfAyahs: c.verses_count
                            }));
                            renderSurahList(allSurahs);
                        })
                        .catch(() => {
                            if (window.QURAN_SURAHS_DATA) {
                                allSurahs = window.QURAN_SURAHS_DATA;
                                renderSurahList(allSurahs);
                            } else {
                                surahListEl.innerHTML = `
                                    <div style="text-align: center; padding: 25px; color: var(--gold);">
                                        <p style="margin-bottom: 12px; font-size: 14px;">تعذر تحميل قائمة السور</p>
                                        <button type="button" onclick="fetchSurahs()" style="cursor: pointer; border: 1px solid var(--gold); color: var(--gold); background: rgba(0,0,0,0.4); padding: 7px 18px; border-radius: 20px; font-family: inherit; font-size: 13px; font-weight: 700;">
                                            <i class="fa-solid fa-rotate-right"></i> إعادة المحاولة
                                        </button>
                                    </div>
                                `;
                            }
                        });
                });
        }

        // Render Sidebar List
        function renderSurahList(surahs) {
            if (surahs.length === 0) {
                surahListEl.innerHTML = `<div style="text-align:center; padding: 20px; color:#aaa;">لا توجد نتائج</div>`;
                return;
            }

            let html = '';
            surahs.forEach(surah => {
                const isActive = surah.number === currentSurahNumber ? 'active' : '';
                html += `
                    <div class="surah-item ${isActive}" data-id="${surah.number}">
                        <div class="surah-number">${surah.number}</div>
                        <div class="surah-details">
                            <div class="surah-name">${surah.name}</div>
                            <div class="surah-info">${surah.revelationType === 'Meccan' ? 'مكية' : 'مدنية'} • آياتها ${surah.numberOfAyahs}</div>
                        </div>
                    </div>
                `;
            });
            surahListEl.innerHTML = html;

            // Add click events
            document.querySelectorAll('.surah-item').forEach(item => {
                item.addEventListener('click', function() {
                    const id = parseInt(this.getAttribute('data-id'));
                    currentSurahNumber = id;
                    // Update active class
                    document.querySelectorAll('.surah-item').forEach(el => el.classList.remove('active'));
                    this.classList.add('active');
                    
                    loadSurah(id);
                    
                    // Close sidebar on mobile
                    if (window.innerWidth <= 900) {
                        toggleSidebar();
                    }
                });
            });
        }

        // Search filtering
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allSurahs.filter(s => 
                s.name.includes(query) || s.englishName.toLowerCase().includes(query)
            );
            renderSurahList(filtered);
        });

        // Resilient Helper: fetch with timeout using native fetch (independent of CDN/axios)
        async function fetchWithTimeout(url, timeoutMs = 6000) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const res = await fetch(url, { signal: controller.signal });
                clearTimeout(timer);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.json();
            } catch(e) {
                clearTimeout(timer);
                throw e;
            }
        }

        // Multi-tier Quran Surah Fetcher:
        // Tier 1: Al-Quran Cloud (Uthmani)
        // Tier 2: Quran.com API v4 (Official Cloudflare high-availability)
        // Tier 3: jsdelivr mirror
        async function smartFetchSurah(id, surahMeta) {
            // Tier 1: Al-Quran Cloud
            try {
                const json = await fetchWithTimeout(`https://api.alquran.cloud/v1/surah/${id}/quran-uthmani`, 6000);
                if (json && json.data && json.data.ayahs && json.data.ayahs.length > 0) {
                    return json.data;
                }
            } catch(err1) {
                console.warn(`Tier 1 (alquran.cloud) failed for surah ${id}:`, err1.message);
            }

            // Tier 2: Quran.com API v4
            try {
                const json2 = await fetchWithTimeout(`https://api.quran.com/api/v4/quran/verses/uthmani?chapter_number=${id}`, 6500);
                if (json2 && json2.verses && json2.verses.length > 0) {
                    return {
                        number: id,
                        name: surahMeta ? surahMeta.name : `سورة ${id}`,
                        englishName: surahMeta ? surahMeta.englishName : `Surah ${id}`,
                        revelationType: surahMeta ? surahMeta.revelationType : 'Meccan',
                        numberOfAyahs: json2.verses.length,
                        ayahs: json2.verses.map((v, idx) => ({
                            number: v.id || idx + 1,
                            numberInSurah: idx + 1,
                            text: v.text_uthmani
                        }))
                    };
                }
            } catch(err2) {
                console.warn(`Tier 2 (quran.com) failed for surah ${id}:`, err2.message);
            }

            // Tier 3: jsdelivr mirror
            try {
                const json3 = await fetchWithTimeout(`https://cdn.jsdelivr.net/gh/risan/quran-json@main/data/surahs/${id}.json`, 6500);
                if (json3 && json3.verses && json3.verses.length > 0) {
                    return {
                        number: id,
                        name: json3.name || (surahMeta ? surahMeta.name : `سورة ${id}`),
                        englishName: json3.transliteration || (surahMeta ? surahMeta.englishName : `Surah ${id}`),
                        revelationType: json3.type || (surahMeta ? surahMeta.revelationType : 'Meccan'),
                        numberOfAyahs: json3.total_verses || json3.verses.length,
                        ayahs: json3.verses.map((v, idx) => ({
                            number: v.id || idx + 1,
                            numberInSurah: v.id || idx + 1,
                            text: v.text
                        }))
                    };
                }
            } catch(err3) {
                console.warn(`Tier 3 (jsdelivr mirror) failed for surah ${id}:`, err3.message);
            }

            throw new Error("جميع خوادم القرآن غير متاحة حالياً");
        }

        // Load Specific Surah Content (with instant caching & multi-tier resilience)
        async function loadSurah(id) {
            readerArea.scrollTop = 0;

            const surahMeta = (allSurahs && allSurahs.find(s => s.number === id)) || 
                              (window.QURAN_SURAHS_DATA && window.QURAN_SURAHS_DATA.find(s => s.number === id));

            // 0. Full local Quran data (all 114 surahs, 0ms instant load, 100% offline!)
            if (window.QURAN_FULL_DATA && window.QURAN_FULL_DATA[id]) {
                renderSurahView(window.QURAN_FULL_DATA[id]);
                return;
            }

            // 1. Built-in initial cache (e.g. Al-Fatihah, 0ms instant load!)
            if (window.SURAHS_INITIAL_CACHE && window.SURAHS_INITIAL_CACHE[id]) {
                renderSurahView(window.SURAHS_INITIAL_CACHE[id]);
                return;
            }

            const cacheKey = 'quiblah_surah_uthmani_' + id;
            const cachedData = localStorage.getItem(cacheKey);
            if (cachedData) {
                try {
                    const data = JSON.parse(cachedData);
                    renderSurahView(data);
                    return;
                } catch(e) {
                    localStorage.removeItem(cacheKey);
                }
            }

            contentContainer.innerHTML = `
                <div class="loader-container">
                    <i aria-hidden="true" class="fa-solid fa-spinner fa-spin fa-3x"></i>
                    <p>جاري تحميل آيات سورة ${surahMeta ? surahMeta.name : id}...</p>
                </div>
            `;

            try {
                const data = await smartFetchSurah(id, surahMeta);
                try {
                    localStorage.setItem(cacheKey, JSON.stringify(data));
                } catch(e) {
                    console.warn("Storage full", e);
                }
                renderSurahView(data);
            } catch(error) {
                contentContainer.innerHTML = `
                    <div class="error-message" style="background: rgba(0,0,0,0.5); border: 1px solid rgba(197,168,89,0.3); border-radius: 16px; padding: 25px; text-align: center; max-width: 500px; margin: 40px auto;">
                        <i class="fa-solid fa-circle-exclamation fa-2x" style="color: var(--gold); margin-bottom: 12px;"></i>
                        <p style="color: #fff; font-size: 15px; margin-bottom: 15px;">تعذر تحميل آيات السورة حالياً. يرجى التحقق من اتصالك بالإنترنت والمحاولة مجدداً.</p>
                        <button onclick="loadSurah(${id})" style="cursor: pointer; border: 1px solid var(--gold); color: var(--gold); background: rgba(0,0,0,0.4); padding: 8px 20px; border-radius: 20px; font-family: inherit; font-size: 13.5px; font-weight: 700; transition: all 0.2s;">
                            <i class="fa-solid fa-rotate-right"></i> إعادة المحاولة الآن
                        </button>
                    </div>
                `;
                console.error("Error fetching surah content:", error);
            }
        }

        function renderSurahView(data) {
            mobileTitle.innerText = data.name;
            
            let html = `
                <div class="surah-header-card">
                    <h1 class="surah-title">${data.name}</h1>
                    <div class="surah-meta">
                        <span>${data.revelationType === 'Meccan' ? 'مكية' : 'مدنية'}</span>
                        <span>آياتها: ${data.numberOfAyahs}</span>
                    </div>
                    <div style="margin-top: 18px; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;">
                        <a href="tafseer.html?surah=${data.number}" style="font-size: 13.5px; padding: 7px 18px; border: 1px solid var(--gold); border-radius: 20px; background: rgba(0,0,0,0.4); color: var(--gold); text-decoration: none; display: inline-flex; align-items: center; gap: 7px; transition: all 0.2s;">
                            <i class="fa-solid fa-book-open-reader"></i> تفسير سورة ${data.name}
                        </a>
                        <button onclick="playSurahGlobalAudio(${data.number}, '${data.name}')" style="font-size: 13.5px; padding: 7px 18px; border: 1px solid var(--gold); border-radius: 20px; background: rgba(197, 168, 89, 0.2); color: var(--gold); cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 7px; transition: all 0.2s;">
                            <i class="fa-solid fa-circle-play"></i> استمع للسورة
                        </button>
                    </div>
                </div>
            `;

            // Add Bismillah for all surahs except Fatihah (1) and Tawbah (9)
            if (data.number !== 1 && data.number !== 9) {
                html += `<div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>`;
            }

            html += `<div class="verses-container">`;
            
            data.ayahs.forEach((ayah, index) => {
                let text = (ayah.text || '').replace(/^\ufeff/, '');
                if (data.number !== 1 && index === 0) {
                    text = text.replace(/^[\ufeff]?بّ?ِسْمِ\s+ٱللَّهِ\s+ٱلرَّحْمَٰنِ\s+ٱلرَّحِيمِ\s*/, '');
                }
                
                html += `
                    <span class="verse">${text}</span>
                    <span class="verse-number" onclick="showQuickTafseer(${data.number}, ${ayah.numberInSurah})" title="اضغط لعرض تفسير الآية (${ayah.numberInSurah})">${ayah.numberInSurah}</span>
                `;
            });

            // Add Sadaqallah Al-Azeem in center
            html += `
                <div class="sadaqallah-box">
                    <span class="sadaqallah-line"></span>
                    <span class="sadaqallah-text">« صَدَقَ اللَّهُ الْعَظِيمُ »</span>
                    <span class="sadaqallah-line"></span>
                </div>
            `;

            html += `</div>`;
            
            // Append Footer
            html += `
                <div style="text-align: center; padding: 20px; margin-top: 40px; color: rgba(255,255,255,0.7); font-size: 14px; border-top: 1px solid rgba(255,255,255,0.1); width: 100%; box-sizing: border-box; line-height: 1.6;">
                    جميع الحقوق محفوظة &copy; 2026 - قبلة المسلم <br>
                    تم التطوير بواسطة <strong style="color: var(--gold);">كمال أبو عيد</strong>
                </div>
            `;

            contentContainer.innerHTML = html;
        }

        // --- Quick Tafseer Modal Logic ---
        function showQuickTafseer(surahNum, ayahNum) {
            const modalBackdrop = document.getElementById('tafseer-modal-backdrop');
            const modalAyahText = document.getElementById('modal-ayah-text');
            const modalTafseerText = document.getElementById('modal-tafseer-text');
            const modalTitle = document.getElementById('modal-title');
            const modalFullLink = document.getElementById('modal-full-link');

            modalBackdrop.classList.add('show');
            modalTitle.innerHTML = `<i class="fa-solid fa-book-open-reader"></i> تفسير الآية (${ayahNum})`;
            modalAyahText.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i>`;
            modalTafseerText.innerHTML = `جاري جلب التفسير الميسر...`;
            modalFullLink.href = `tafseer.html?surah=${surahNum}&ayah=${ayahNum}`;

            fetchWithTimeout(`https://api.alquran.cloud/v1/ayah/${surahNum}:${ayahNum}/editions/quran-uthmani,ar.muyassar`, 6000)
                .then(res => {
                    const editions = res.data;
                    const quranAyah = editions.find(e => e.edition.identifier === 'quran-uthmani') || editions[0];
                    const tafseerAyah = editions.find(e => e.edition.identifier === 'ar.muyassar') || editions[1];

                    modalTitle.innerHTML = `<i class="fa-solid fa-book-open-reader"></i> ${quranAyah.surah.name} - آية (${ayahNum})`;
                    modalAyahText.innerText = quranAyah.text;
                    modalTafseerText.innerText = tafseerAyah.text;
                })
                .catch(err => {
                    console.warn("Alquran quick tafseer failed, trying fallback...", err);
                    fetchWithTimeout(`https://api.quran.com/api/v4/verses/by_key/${surahNum}:${ayahNum}?words=false&tafsirs=16`, 6000)
                        .then(r2 => {
                            if (r2 && r2.verse) {
                                modalTitle.innerHTML = `<i class="fa-solid fa-book-open-reader"></i> آية (${ayahNum})`;
                                modalAyahText.innerText = r2.verse.text_uthmani || `آية ${ayahNum}`;
                                modalTafseerText.innerText = (r2.verse.tafsirs && r2.verse.tafsirs[0] ? r2.verse.tafsirs[0].text : "التفسير متاح في صفحة التفسير الشاملة");
                                return;
                            }
                            throw new Error();
                        })
                        .catch(() => {
                            modalAyahText.innerText = `تعذر جلب نص الآية`;
                            modalTafseerText.innerText = `حدث خطأ أثناء جلب التفسير المباشر. يرجى الضغط على زر 'عرض في صفحة التفسير الشاملة' بالأسفل.`;
                        });
                });
        }

        function closeQuickTafseer() {
            const modalBackdrop = document.getElementById('tafseer-modal-backdrop');
            modalBackdrop.classList.remove('show');
        }

        const modalCloseBtn = document.getElementById('modal-close-btn');
        if (modalCloseBtn) modalCloseBtn.addEventListener('click', closeQuickTafseer);

        const modalBackdropEl = document.getElementById('tafseer-modal-backdrop');
        if (modalBackdropEl) {
            modalBackdropEl.addEventListener('click', (e) => {
                if (e.target.id === 'tafseer-modal-backdrop') closeQuickTafseer();
            });
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeQuickTafseer();
        });

        // Initialize with query params support
        const urlParams = new URLSearchParams(window.location.search);
        const urlSurah = parseInt(urlParams.get('surah'));
        if (urlSurah && urlSurah >= 1 && urlSurah <= 114) {
            currentSurahNumber = urlSurah;
        }

        fetchSurahs();
        // Load target surah immediately (defaults to Surah 1 Al-Fatihah)
        loadSurah(currentSurahNumber);

    </script>

    <script src="toast.js"></script>
    <script src="pwa.js"></script>
</body>
</html>
