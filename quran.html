<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>القرآن الكريم - قراءة</title>

    <!-- SEO & Open Graph Tags -->
    <meta name="description" content="تطبيق قبلة المسلم: أوقات الصلاة الدقيقة، اتجاه القبلة، القرآن الكريم، الأذكار، وأسماء الله الحسنى في مكان واحد بتصميم عصري.">
    <meta name="keywords" content="صلاة, قبلة, قرآن, أذكار, أسماء الله الحسنى, أوقات الصلاة, مواقيت, مسلم">
    <meta name="author" content="كمال أبو عيد">
    <meta property="og:title" content="قبلة المسلم">
    <meta property="og:description" content="تطبيق قبلة المسلم: أوقات الصلاة الدقيقة، اتجاه القبلة، القرآن الكريم، الأذكار، وأسماء الله الحسنى.">
    <meta property="og:image" content="assets/bg1.jpg">
    <meta property="og:url" content="https://kamalaboueidd.github.io/Quiblah-Muslim-/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="قبلة المسلم">
    <meta name="twitter:description" content="تطبيق إسلامي شامل لأوقات الصلاة، القبلة، القرآن، والأذكار.">
    <link rel="preload" as="image" href="assets/bg1.jpg">
    <script src="core/player-bridge.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Amiri+Quran&display=swap" rel="stylesheet" />
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" /></noscript>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="icon" type="image/svg+xml" href="assets/mosque.svg">
    
    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#C5A859">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="قبلة المسلم">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    
    <link rel="stylesheet" href="features/quran/quran.css">
</head>
<body>

    <!-- Fullscreen Background Carousel -->
    <div class="fullscreen-carousel">
        <div class="carousel-slide active" style="background-image: url('assets/bg1.jpg');"></div>
        <div class="carousel-slide" style="background-image: url('assets/bg2.jpg');"></div>
        <div class="carousel-slide" style="background-image: url('assets/bg3.jpg');"></div>
        <div class="carousel-overlay"></div>
    </div>

    <!-- Layout -->
    <div class="app-layout">
        
        <!-- Sidebar Overlay (Mobile) -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">
                    <span><i class="fa-solid fa-book-quran"></i> سور القرآن الكريم</span>
                    <button type="button" class="sidebar-close-btn" id="sidebar-close-btn" onclick="toggleSidebar()" aria-label="إغلاق قائمة السور">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <div class="search-box">
                    <i aria-hidden="true" class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-input" placeholder="ابحث عن سورة..." />
                </div>
            </div>
            <div class="surah-list" id="surah-list">
                <!-- Surahs injected here -->
                <div style="text-align: center; color: var(--gold); padding: 20px;">
                    <i aria-hidden="true" class="fa-solid fa-spinner fa-spin fa-2x"></i>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            
            <!-- Reader Area -->
            <div class="reader-area" id="reader-area">
                <!-- Top Navigation & Action Row (Borderless, Backgroundless, Straight) -->
                <div class="reader-top-bar">
                    <div class="nav-right-cluster">
                        <button type="button" class="menu-btn" id="menu-btn" aria-label="فتح قائمة السور">
                            <i class="fa-solid fa-bars"></i>
                            <span>قائمة السور</span>
                        </button>
                        <span class="header-page-title" id="mobile-title">
                            <i class="fa-solid fa-book-quran"></i>
                            <span>القرآن الكريم</span>
                        </span>
                    </div>
                    <a href="home.html" class="back-home-btn" title="الرجوع لصفحة المواقيت الرئيسية">
                        <i class="fa-solid fa-arrow-right"></i>
                        <span>الرجوع للمواقيت</span>
                    </a>
                </div>

                <div id="content-container">
                    <!-- Default State -->
                    <div class="loader-container" style="height: 80vh;">
                        <i aria-hidden="true" class="fa-solid fa-book-open fa-3x" style="margin-bottom: 15px; opacity: 0.5;"></i>
                        <p style="opacity: 0.7;">اختر سورة من القائمة للقراءة</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Quick Tafseer Modal -->
    <div class="tafseer-modal-backdrop" id="tafseer-modal-backdrop">
        <div class="tafseer-modal-card">
            <div class="modal-header">
                <div class="modal-title" id="modal-title"><i class="fa-solid fa-book-open-reader"></i> تفسير الآية</div>
                <button class="modal-close-btn" id="modal-close-btn" title="إغلاق"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <div class="modal-ayah-text" id="modal-ayah-text"></div>
                <div style="font-weight: 800; color: var(--gold); margin-bottom: 8px; font-size: 14px;">
                    <i class="fa-solid fa-book-open"></i> التفسير الميسر:
                </div>
                <div class="modal-tafseer-text" id="modal-tafseer-text"></div>
            </div>
            <div class="modal-footer">
                <a id="modal-full-link" href="tafseer.html">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i> عرض في صفحة التفسير الشاملة
                </a>
            </div>
        </div>
    </div>

    <script src="core/surahs_meta.js"></script>
    <script src="core/quran_data.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="core/toast.js"></script>
    <script src="core/pwa.js"></script>
    <script src="features/quran/quran.js"></script>
</body>
</html>
