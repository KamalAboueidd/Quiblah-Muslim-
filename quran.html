    <style>
        :root {
            --primary-teal: #2F7A78;
            --gold: #C5A859;
            --white: #FFFFFF;
        }

        body {
            font-family: "Tajawal", sans-serif;
            margin: 0;

        }

        /* --- Fullscreen Background Carousel (Same as index.html) --- */
        .fullscreen-carousel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        .carousel-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }
        .carousel-slide.active { opacity: 1; }
        .carousel-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7); 
            backdrop-filter: blur(5px);
        }

        /* --- App Layout --- */
        .app-layout {
            display: flex;
            height: 100dvh;
            width: 100%;
            position: relative;
            z-index: 10;
        }
        
        /* Navigation Bar */
        .nav-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 15px 20px;
            flex-wrap: wrap;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            text-decoration: none;
            font-weight: 800;
            font-size: 15px;
            transition: all 0.3s;
        }

        .nav-item:hover, .nav-item.active {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid var(--gold);
            color: var(--gold);
            box-shadow: 0 5px 15px rgba(197, 168, 89, 0.2);
        }

        /* --- Sidebar --- */
        .sidebar {
            width: 320px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .search-box {
            position: relative;
            width: 100%;
        }
        
        .search-box input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 14px 15px 14px 45px;
            border-radius: 12px;
            outline: none;
            font-family: inherit;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .search-box input:focus { border-color: var(--gold); }
        .search-box input::placeholder { color: rgba(255,255,255,0.4); }
        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.4);
        }

        .surah-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px 10px;
        }

        .surah-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;

            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            margin-bottom: 5px;
            gap: 12px;

        .surah-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .surah-item.active {

            border: 1px solid var(--gold);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);

        .surah-number {

            height: 32px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 8px;

        }

        }

            box-shadow: 0 0 10px rgba(197, 168, 89, 0.6);
        }

        /* Sadaqallah Al-Azeem */
        .sadaqallah-box {
            display: flex;

            justify-content: center;
            gap: 15px;
            margin: 45px auto 25px auto;
            text-align: center;

        .sadaqallah-text {

        .tafseer-modal-backdrop {
            display: none;

            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;

            background: rgba(20, 24, 30, 0.95);
            border: 1px solid var(--gold);
            border-radius: 20px;
            max-width: 650px;

            display: flex;
            flex-direction: column;

        .modal-header {
            display: flex;

            font-size: 24px;

            margin-bottom: 18px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            border: 1px solid rgba(197, 168, 89, 0.2);
        }

        .modal-tafseer-text {
            font-size: 16px;
            line-height: 1.9;

        .modal-footer {

        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            color: var(--gold);

            font-weight: 800;
        }

        /* Overlay for mobile sidebar */
        .sidebar-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 90;
            opacity: 0;
            transition: opacity 0.3s;

        @media (max-width: 900px) {
            .nav-bar { gap: 10px; padding: 10px; }

                position: absolute;

                height: 100%;
                z-index: 100;
                transform: translateX(100%);
            }
            .sidebar.open {

                box-shadow: -10px 0 30px rgba(0,0,0,0.8);

            .sidebar-overlay.active {

            .verses-container { line-height: 2.3; }

            .sadaqallah-line { max-width: 60px; }

        /* Desktop Compact Tweaks */
        @media (min-width: 900px) {
            .nav-bar { padding: 10px 20px; gap: 10px; }
            .nav-item { padding: 8px 15px; font-size: 14px; }
            .sidebar { width: 300px; }
            .reader-area { padding: 20px 40px; }
            
            .surah-header-card { padding: 20px; margin: 0 auto 20px auto; max-width: 500px; }
            .surah-title { font-size: 44px; margin: 0 0 10px 0; }
            .surah-meta { font-size: 16px; gap: 20px; }
            .bismillah { font-size: 32px; margin-bottom: 25px; }
            
            .verses-container { max-width: 900px; padding: 0 20px; line-height: 2.2; }
            .verse { font-size: 28px; }
            .verse-number { width: 26px; height: 26px; font-size: 11px; margin: 0 5px; }

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        // Header Carousel Logic
        const slides = document.querySelectorAll('.carousel-slide');
        let currentSlide = 0;
        setInterval(() => {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }, 8000);

        // Sidebar Mobile Toggle
        const sidebar = document.getElementById('sidebar');
        const menuBtn = document.getElementById('menu-btn');
        const overlay = document.getElementById('sidebar-overlay');
        
        function toggleSidebar() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        menuBtn.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);

        // API Integration
        let allSurahs = [];
        let currentSurahNumber = 1;

        const surahListEl = document.getElementById('surah-list');
        const searchInput = document.getElementById('search-input');
        const contentContainer = document.getElementById('content-container');
        const readerArea = document.getElementById('reader-area');
        const mobileTitle = document.getElementById('mobile-title');

        // Fetch All Surahs
        function fetchSurahs() {
            axios.get('https://api.alquran.cloud/v1/surah')
                .then(response => {
                    allSurahs = response.data.data;
                    renderSurahList(allSurahs);
                    
                    if (window.innerWidth <= 900) {
                        toggleSidebar();
                    }
                })
                .catch(error => {
                    surahListEl.innerHTML = `<div class="error-message">حدث خطأ في تحميل السور</div>`;
                    console.error("Error fetching surahs:", error);
                });
        }

        // Render Sidebar List
        function renderSurahList(surahs) {
            if (surahs.length === 0) {
                surahListEl.innerHTML = `<div style="text-align:center; padding: 20px; color:#aaa;">لا توجد نتائج</div>`;
                return;
            }

            let html = '';
            surahs.forEach(surah => {
                const isActive = surah.number === currentSurahNumber ? 'active' : '';
                html += `
                    <div class="surah-item ${isActive}" data-id="${surah.number}">
                        <div class="surah-number">${surah.number}</div>
                        <div class="surah-details">
                            <div class="surah-name">${surah.name}</div>
                            <div class="surah-info">${surah.revelationType === 'Meccan' ? 'مكية' : 'مدنية'} • آياتها ${surah.numberOfAyahs}</div>
                        </div>
                    </div>
                `;
            });
            surahListEl.innerHTML = html;

            // Add click events
            document.querySelectorAll('.surah-item').forEach(item => {
                item.addEventListener('click', function() {
                    const id = parseInt(this.getAttribute('data-id'));
                    if (id !== currentSurahNumber) {
                        currentSurahNumber = id;
                        // Update active class
                        document.querySelectorAll('.surah-item').forEach(el => el.classList.remove('active'));
                        this.classList.add('active');
                        
                        loadSurah(id);
                        
                        // Close sidebar on mobile
                        if (window.innerWidth <= 900) {
                            toggleSidebar();
                        }
                    }
                });
            });
        }

        // Search filtering
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allSurahs.filter(s => 
                s.name.includes(query) || s.englishName.toLowerCase().includes(query)
            );
            renderSurahList(filtered);
        });

        // Load Specific Surah Content
        function loadSurah(id) {
            contentContainer.innerHTML = `
                <div class="loader-container">
                    <i aria-hidden="true" class="fa-solid fa-spinner fa-spin fa-3x"></i>
                    <p>جاري التحميل...</p>
                </div>
            `;
            
            // Scroll to top
            readerArea.scrollTop = 0;

            axios.get(`https://api.alquran.cloud/v1/surah/${id}/quran-uthmani`)
                .then(response => {
                    const data = response.data.data;
                    mobileTitle.innerText = data.name;
                    
                    let html = `
                        <div class="surah-header-card">
                            <h1 class="surah-title">${data.name}</h1>
                            <div class="surah-meta">
                                <span>${data.revelationType === 'Meccan' ? 'مكية' : 'مدنية'}</span>
                                <span>آياتها: ${data.numberOfAyahs}</span>
                            </div>
                            <div style="margin-top: 14px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;">
                                <a href="tafseer.html?surah=${data.number}" class="nav-item" style="font-size: 13px; padding: 6px 16px; border-color: var(--gold); color: var(--gold); text-decoration: none;">
                                    <i class="fa-solid fa-book-open-reader"></i> تفسير سورة ${data.name}
                                </a>
                                <button onclick="playSurahGlobalAudio(${data.number}, '${data.name}')" class="nav-item" style="font-size: 13px; padding: 6px 16px; border-color: var(--gold); background: rgba(197, 168, 89, 0.2); color: var(--gold); cursor: pointer; font-family: inherit;">
                                    <i class="fa-solid fa-circle-play"></i> استمع للسورة
                                </button>
                            </div>
                        </div>
                    `;

                    // Add Bismillah for all surahs except Fatihah (1) and Tawbah (9)
                    if (data.number !== 1 && data.number !== 9) {
                        html += `<div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>`;
                    }

                    html += `<div class="verses-container">`;
                    
                    data.ayahs.forEach((ayah, index) => {
                        let text = ayah.text;
                        // Remove Bismillah from the first ayah text if it exists (for surahs other than Fatihah)
                        if (data.number !== 1 && index === 0 && text.startsWith('بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ ')) {
                            text = text.replace('بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ ', '');
                        }
                        
                        html += `
                            <span class="verse">${text}</span>
                            <span class="verse-number" onclick="showQuickTafseer(${data.number}, ${ayah.numberInSurah})" title="اضغط لعرض تفسير الآية (${ayah.numberInSurah})">${ayah.numberInSurah}</span>
                        `;
                    });

                    // Add Sadaqallah Al-Azeem in center
                    html += `
                        <div class="sadaqallah-box">
                            <span class="sadaqallah-line"></span>
                            <span class="sadaqallah-text">« صَدَقَ اللَّهُ الْعَظِيمُ »</span>
                            <span class="sadaqallah-line"></span>
                        </div>
                    `;

                    html += `</div>`;
                    
                    // Append Footer
                    html += `
                        <div style="text-align: center; padding: 20px; margin-top: 40px; color: rgba(255,255,255,0.7); font-size: 14px; border-top: 1px solid rgba(255,255,255,0.1); width: 100%; box-sizing: border-box; line-height: 1.6;">
                            جميع الحقوق محفوظة &copy; 2026 - قبلة المسلم <br>
                            تم التطوير بواسطة <strong style="color: var(--gold);">كمال أبو عيد</strong>
                        </div>
                    `;

                    contentContainer.innerHTML = html;
                })
                .catch(error => {
                    contentContainer.innerHTML = `<div class="error-message">حدث خطأ أثناء جلب الآيات. يرجى التأكد من اتصالك بالإنترنت.</div>`;
                    console.error("Error fetching surah content:", error);
                });
        }

        // --- Quick Tafseer Modal Logic ---
        function showQuickTafseer(surahNum, ayahNum) {
            const modalBackdrop = document.getElementById('tafseer-modal-backdrop');
            const modalAyahText = document.getElementById('modal-ayah-text');
            const modalTafseerText = document.getElementById('modal-tafseer-text');
            const modalTitle = document.getElementById('modal-title');
            const modalFullLink = document.getElementById('modal-full-link');

            modalBackdrop.classList.add('show');
            modalTitle.innerHTML = `<i class="fa-solid fa-book-open-reader"></i> تفسير الآية (${ayahNum})`;
            modalAyahText.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i>`;
            modalTafseerText.innerHTML = `جاري جلب التفسير الميسر...`;
            modalFullLink.href = `tafseer.html?surah=${surahNum}&ayah=${ayahNum}`;

            axios.get(`https://api.alquran.cloud/v1/ayah/${surahNum}:${ayahNum}/editions/quran-uthmani,ar.muyassar`)
                .then(res => {
                    const editions = res.data.data;
                    const quranAyah = editions.find(e => e.edition.identifier === 'quran-uthmani') || editions[0];
                    const tafseerAyah = editions.find(e => e.edition.identifier === 'ar.muyassar') || editions[1];

                    modalTitle.innerHTML = `<i class="fa-solid fa-book-open-reader"></i> ${quranAyah.surah.name} - آية (${ayahNum})`;
                    modalAyahText.innerText = quranAyah.text;
                    modalTafseerText.innerText = tafseerAyah.text;
                })
                .catch(err => {
                    modalAyahText.innerText = `تعذر جلب نص الآية`;
                    modalTafseerText.innerText = `حدث خطأ أثناء جلب التفسير. يرجى التأكد من اتصالك بالإنترنت.`;
                });
        }

        function closeQuickTafseer() {
            const modalBackdrop = document.getElementById('tafseer-modal-backdrop');
            modalBackdrop.classList.remove('show');
        }

        document.getElementById('modal-close-btn').addEventListener('click', closeQuickTafseer);
        document.getElementById('tafseer-modal-backdrop').addEventListener('click', (e) => {
            if (e.target.id === 'tafseer-modal-backdrop') closeQuickTafseer();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeQuickTafseer();
        });

        // Initialize with query params support
        const urlParams = new URLSearchParams(window.location.search);
        const urlSurah = parseInt(urlParams.get('surah'));
        if (urlSurah && urlSurah >= 1 && urlSurah <= 114) {
            currentSurahNumber = urlSurah;
        }

        fetchSurahs();
        // Load target surah immediately if specified
        if (urlSurah && urlSurah >= 1 && urlSurah <= 114) {
            loadSurah(urlSurah);
        }

    </script>

    <!-- Quick Tafseer Modal -->
    <div class="tafseer-modal-backdrop" id="tafseer-modal-backdrop">
        <div class="tafseer-modal-card">
            <div class="modal-header">
                <div class="modal-title" id="modal-title"><i class="fa-solid fa-book-open-reader"></i> تفسير الآية</div>
                <button class="modal-close-btn" id="modal-close-btn" title="إغلاق"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <div class="modal-ayah-text" id="modal-ayah-text"></div>
                <div style="font-weight: 800; color: var(--gold); margin-bottom: 8px; font-size: 14px;">
                    <i class="fa-solid fa-book-open"></i> التفسير الميسر:
                </div>
                <div class="modal-tafseer-text" id="modal-tafseer-text"></div>
            </div>
            <div class="modal-footer">
                <a id="modal-full-link" href="tafseer.html" class="nav-item" style="border-color: var(--gold); color: var(--gold); text-decoration: none;">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i> عرض في صفحة التفسير الشاملة
                </a>
            </div>
        </div>
    </div>

    <script src="toast.js"></script>
    <script src="pwa.js"></script>
</body>
</html>
