    <style>
        :root {
            --primary-teal: #2F7A78;
            --gold: #C5A859;

            --white: #FFFFFF;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Tajawal", sans-serif;
            background: #000;
            color: var(--white);

        /* Fullscreen Carousel (Matching names.html and other pages) */
        .fullscreen-carousel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        .carousel-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }
        .carousel-slide.active { opacity: 1; }
        .carousel-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.60);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }

        /* App Layout */
        .app-layout {
            display: flex;
            height: 100dvh;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        /* Top Navigation Header - Clean Minimalist Bar */
        .top-nav-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(197, 168, 89, 0.2);

        .back-home-btn:hover {

        /* Sidebar (Surahs Drawer) */
        .sidebar {

        .search-box { position: relative; width: 100%; }

        .search-box input {

        .search-box input::placeholder { color: rgba(255, 255, 255, 0.4); }

        .search-box i {

            transform: translateY(-50%);

        .surah-number {

        .surah-item.active .surah-number {
            background: var(--gold);
            color: #111;
        }

        .surah-details { flex: 1; min-width: 0; }
        .surah-name {
            font-weight: 800;
            font-size: 14px;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .surah-info {
            font-size: 11px;
            color: #aaa;
            font-weight: 500;
            display: flex;
            gap: 8px;
            margin-top: 2px;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            min-width: 0;
            overflow: hidden;
        }

        /* Mobile Header */
        .mobile-header {
            display: none;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);

        .mobile-header .title {

        .menu-btn {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(197, 168, 89, 0.3);
            color: var(--gold);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
        }

        /* Reader Area */
        .reader-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 25px 60px;
            scroll-behavior: smooth;
        }

        /* Clean Transparent Controls Bar */
        .tafseer-controls-bar {
            max-width: 1100px;
            margin: 0 auto 25px auto;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(197, 168, 89, 0.2);
            border-radius: 14px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .control-label {
            font-size: 13px;
            font-weight: 700;
            color: var(--gold);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Custom Luxury Dropdown - NO Native Blue Browser Box! */
        .custom-dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-trigger {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(197, 168, 89, 0.35);
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 10px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
            user-select: none;
        }

        .dropdown-trigger:hover, .dropdown-trigger.open {
            border-color: var(--gold);
            box-shadow: 0 0 15px rgba(197, 168, 89, 0.2);
            background: rgba(197, 168, 89, 0.1);
        }

        .dropdown-arrow {
            font-size: 11px;
            color: var(--gold);
            transition: transform 0.25s ease;
        }

        .dropdown-trigger.open .dropdown-arrow {
            transform: rotate(180deg);
        }

        .dropdown-menu {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            min-width: 270px;
            background: rgba(16, 18, 24, 0.97);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1.5px solid rgba(197, 168, 89, 0.4);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(197, 168, 89, 0.15);
            padding: 6px;
            z-index: 200;
            display: none;
        }

        .dropdown-menu.show {
            display: block;
            animation: fadeInDrop 0.2s ease;
        }

        @keyframes fadeInDrop {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dropdown-item {
            padding: 11px 14px;
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.15s;
        }

        .dropdown-item:hover {
            background: rgba(197, 168, 89, 0.18);
            color: var(--gold);
        }

        .dropdown-item.active {
            background: rgba(197, 168, 89, 0.22);
            color: var(--gold);
            font-weight: 800;
        }

        .dropdown-item .item-check {
            opacity: 0;
            font-size: 12px;
            color: var(--gold);
        }

        .dropdown-item.active .item-check {
            opacity: 1;
        }

        /* Ayah Search Input */
        /* Ayah Search Group & Jump Button */
        .ayah-search-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ayah-search-box {
            position: relative;
            display: flex;
            align-items: center;
            width: 250px;
        }

        .ayah-search-box .search-icon {
            position: absolute;
            right: 12px;
            color: var(--gold);
            font-size: 13px;
            pointer-events: none;
        }

        .ayah-search-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(197, 168, 89, 0.35);
            color: #ffffff;
            padding: 8px 36px 8px 32px;
            border-radius: 10px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            outline: none;
            transition: all 0.2s;
        }

        .ayah-search-input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 14px rgba(197, 168, 89, 0.25);
            background: rgba(0, 0, 0, 0.7);
        }

        .ayah-search-input::placeholder {
            color: rgba(255, 255, 255, 0.45);
            font-size: 12px;
        }

        .clear-search-btn {
            position: absolute;
            left: 8px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            font-size: 12px;
            padding: 4px;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .clear-search-btn:hover {
            color: #fff;
        }

        .search-jump-btn {
            background: rgba(197, 168, 89, 0.2);
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .search-jump-btn:hover {
            background: var(--gold);
            color: #111;
        }

        /* Surah Header Section - Generous Breathing Room & Spacing */
        .surah-header-section {
            max-width: 1100px;
            margin: 0 auto 35px auto;
            text-align: center;
            background: transparent;
            padding: 30px 0 15px 0;
        }

        .surah-title {
            font-family: 'Amiri Quran', serif;
            font-size: 52px;
            color: var(--gold);
            margin: 0 0 28px 0; /* Significant, comfortable distance beneath the title! */
            text-shadow: 0 2px 14px rgba(0, 0, 0, 0.95);
            line-height: 1.35;
        }

        /* Meta details: NO black or blue backgrounds, generous spacing */
        .surah-meta {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 26px;
            color: #ddd;
            font-weight: 700;
            font-size: 14px;
            flex-wrap: wrap;
            margin-bottom: 28px; /* Clear breathing room below meta */
        }

        .surah-meta-item {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: none;
            padding: 0;
            color: #e2e8f0;
        }

        .surah-meta-item i { color: var(--gold); }

        .surah-header-actions {
            margin-top: 10px;
            margin-bottom: 26px; /* Clear breathing room below actions */
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .header-action-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 18px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(197, 168, 89, 0.4);
            color: var(--gold);
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s, border-color 0.2s;
        }

        .header-action-link:hover {
            background: rgba(197, 168, 89, 0.2);
            border-color: var(--gold);
        }

        .bismillah {
            text-align: center;
            font-family: 'Amiri Quran', serif;
            font-size: 32px;
            margin: 25px auto 35px auto; /* Generous breathing room */
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
        }

        /* Tafseer Table Container (Styled like names.html) */
        .tafseer-table-container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(197, 168, 89, 0.2);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.35);
        }

        /* Table Header */
        .tafseer-table-header {
            display: grid;
            grid-template-columns: 85px 1fr 1.15fr;
            background: rgba(197, 168, 89, 0.15);
            border-bottom: 2px solid rgba(197, 168, 89, 0.3);
            color: var(--gold);
            font-weight: 800;
            font-size: 15px;
            padding: 14px 18px;
            align-items: center;
        }

        .th-num { text-align: center; }
        .th-ayah { padding-right: 10px; }
        .th-tafseer { padding-right: 15px; }

        /* Table Row (Ayah on one side, Tafseer on other side) */
        .tafseer-row {
            display: grid;
            grid-template-columns: 85px 1fr 1.15fr;
            padding: 18px 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            align-items: start;
            transition: background 0.2s;
            position: relative;
        }

        .tafseer-row:last-child {
            border-bottom: none;
        }

        .tafseer-row:hover {
            background: rgba(197, 168, 89, 0.04);
        }

        .tafseer-row.highlighted {
            background: rgba(197, 168, 89, 0.15) !important;
            border-left: 3px solid var(--gold);
            border-right: 3px solid var(--gold);
        }

        /* Column 1: Number & Actions */
        .td-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            padding-top: 4px;
        }

        .ayah-circle-badge {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 1.5px solid var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            font-weight: 800;
            font-size: 11px;
            background: transparent;
        }

        /* Action buttons: Transparent background, golden color, NO movement on hover */
        .row-action-buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .ayah-action-btn {
            background: none !important;
            border: none !important;
            box-shadow: none !important;
            color: var(--gold);
            cursor: pointer;
            font-size: 15px;
            padding: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s, color 0.2s;
            transform: none !important; /* Never move/jump on hover */
        }

        .ayah-action-btn:hover {
            color: #ffffff;
            opacity: 0.85;
            transform: none !important;
        }

        .ayah-action-btn.playing {
            color: #4ade80 !important;
        }

        /* Column 2: Ayah Text */
        .td-ayah {
            padding: 0 12px;
            text-align: right;
            direction: rtl;
        }

        .ayah-arabic-text {
            font-family: 'Amiri Quran', serif;
            font-size: 25px;
            line-height: 2.1;
            color: #ffffff;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.85);
        }

        .ayah-inline-num {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 1px solid var(--gold);
            color: var(--gold);
            font-family: "Tajawal", sans-serif;
            font-size: 10px;
            font-weight: 800;
            margin: 0 3px;
            vertical-align: middle;
        }

        /* Column 3: Tafseer Text */
        .td-tafseer {
            padding: 0 16px;
            border-right: 1px solid rgba(255, 255, 255, 0.08);
        }

        .tafseer-text {
            font-size: 15px;
            line-height: 1.85;
            color: #e2e8f0;
            text-align: justify;
            font-weight: 500;
        }

        /* Load More Button (Pagination / Chunking) */
        .load-more-container {
            display: flex;
            justify-content: center;
            margin: 25px 0 10px 0;
            width: 100%;
        }

        .load-more-btn {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            border: 1px solid var(--gold);
            color: var(--gold);
            font-family: inherit;
            font-size: 14px;
            font-weight: 800;
            padding: 10px 26px;
            border-radius: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s, color 0.2s;
        }

        .load-more-btn:hover {
            background: rgba(197, 168, 89, 0.2);
            color: #ffffff;
        }

        /* Centered Sadaqallah Al-Azeem in Gold with Tashkeel */
        .sadaqallah-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 35px auto 20px auto;
            text-align: center;
            width: 100%;
            max-width: 600px;
        }

        .sadaqallah-text {
            font-family: 'Amiri Quran', serif;
            font-size: 28px;
            color: var(--gold);
            text-shadow: 0 2px 10px rgba(197, 168, 89, 0.4);
            white-space: nowrap;
            letter-spacing: 1px;
        }

        .sadaqallah-line {
            height: 1.5px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            flex: 1;
            max-width: 100px;
        }

        /* Scroll to Top Button: NO background, NO border, just the icon! */
        .scroll-top-btn {
            position: fixed;
            bottom: 28px;
            left: 28px;
            background: none !important;
            border: none !important;
            box-shadow: none !important;
            color: var(--gold);
            font-size: 32px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 0;
            transition: opacity 0.2s, color 0.2s;
            transform: none !important;
        }

        .scroll-top-btn:hover {
            color: #dfc274;
            transform: none !important;
        }

        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 40vh;
            color: var(--gold);
            gap: 14px;
            font-size: 16px;
            font-weight: 700;
        }

        .error-message {
            color: #f87171;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.25);
            border-radius: 12px;
            text-align: center;
            padding: 24px;
            font-size: 16px;
            font-weight: 700;
            max-width: 500px;
            margin: 30px auto;
        }

        .sidebar-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            z-index: 90;
            opacity: 0;
            transition: opacity 0.3s;
        }

        ::-webkit-scrollbar { width: 7px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 4px; }

        /* Responsive Breakpoints */
        @media (max-width: 850px) {
            .sidebar {
                position: absolute;
                right: 0;
                top: 0;
                height: 100%;
                z-index: 100;
                transform: translateX(100%);
                width: 290px;
            }
            .sidebar.open { transform: translateX(0); box-shadow: -10px 0 35px rgba(0, 0, 0, 0.9); }
            .sidebar-overlay.active { display: block; opacity: 1; }

            .mobile-header { display: flex; }
            .reader-area { padding: 14px 10px 40px; }

            /* Switch Table Grid to Stacked Card on Mobile */
            .tafseer-table-header { display: none; }

            .tafseer-row {
                display: flex;
                flex-direction: column;

            .td-ayah { padding: 0; width: 100%; }

                padding: 10px 0 0 0;
                border-right: none;
                border-top: 1px solid rgba(197, 168, 89, 0.15);

            }

            .tafseer-text { font-size: 14px; line-height: 1.8; }
            .surah-title { font-size: 34px; }
            .bismillah { font-size: 24px; }
            .scroll-top-btn { bottom: 18px; left: 18px; font-size: 28px; }
        }
    </style>
</head>
<body>

    <!-- Fullscreen Background Carousel -->
    <div class="fullscreen-carousel">
        <div class="carousel-slide active" style="background-image: url('assets/bg1.jpg');"></div>
        <div class="carousel-slide" style="background-image: url('assets/bg2.jpg');"></div>
        <div class="carousel-slide" style="background-image: url('assets/bg3.jpg');"></div>
        <div class="carousel-overlay"></div>
    </div>

    <!-- Main Layout -->
    <div class="app-layout">
        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <!-- Sidebar (Surahs Drawer) -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">
                    <span><i class="fa-solid fa-book-open-reader"></i> سور القرآن الكريم</span>
                    <span class="surah-counter" id="surah-counter">114 سورة</span>
                </div>
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                    <input type="text" id="search-input" placeholder="ابحث باسم السورة أو رقمها..." />
                </div>

            <div class="surah-list" id="surah-list">

                    <i class="fa-solid fa-spinner fa-spin fa-2x"></i>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Clean Header with Back to Prayer Times -->
            <div class="top-nav-header">

                    <i class="fa-solid fa-arrow-right"></i>
                    <span>الرجوع للمواقيت</span>
                </a>
                <div class="header-surah-indicator">
                    <button class="menu-btn" id="menu-btn" aria-label="فتح قائمة السور">
                        <i class="fa-solid fa-bars"></i> قائمة السور

                    <span class="header-page-title">

            <!-- Reader Scroll Container -->
            <div class="reader-area" id="reader-area">
                <!-- Controls Bar with Custom Luxury Dropdown and Ayah Search -->

                                    <i class="fa-solid fa-check item-check"></i>
                                    <span>تفسير الجلالين</span>

                    <div class="control-group">
                        <div class="ayah-search-group">
                            <div class="ayah-search-box">

                <!-- Surah Tafseer Container -->
                <div id="content-container">
                    <div class="loader-container">
                        <i class="fa-solid fa-book-open-reader fa-3x" style="opacity: 0.6;"></i>
                        <p>اختر سورة من القائمة لعرض تفسير آياتها</p>
                    </div>
                </div>

                <!-- Footer -->
                <div style="text-align: center; padding: 25px 20px; margin-top: 40px; color: rgba(255,255,255,0.55); font-size: 13px; border-top: 1px solid rgba(255,255,255,0.06); width: 100%; box-sizing: border-box; line-height: 1.8;">
                    جميع الحقوق محفوظة &copy; 2026 - قبلة المسلم <br>
                    تم التطوير بواسطة <strong style="color: var(--gold);">كمال أبو عيد</strong>
                </div>

        </main>
    </div>

    <!-- Scroll to Top: NO background, NO border, just the floating arrow -->
    <button class="scroll-top-btn" id="scroll-top-btn" title="العودة للأعلى" aria-label="العودة للأعلى">
        <i class="fa-solid fa-chevron-up"></i>
    </button>

    <audio id="ayah-audio" preload="none"></audio>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        // Carousel Rotation
        const slides = document.querySelectorAll('.carousel-slide');
        let currentSlide = 0;
        setInterval(() => {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }, 8000);

        const sidebar = document.getElementById('sidebar');
        const menuBtn = document.getElementById('menu-btn');
        const overlay = document.getElementById('sidebar-overlay');
        const surahListEl = document.getElementById('surah-list');
        const searchInput = document.getElementById('search-input');
        const contentContainer = document.getElementById('content-container');
        const readerArea = document.getElementById('reader-area');
        const mobileTitle = document.getElementById('mobile-title');
        const dropdownTrigger = document.getElementById('dropdown-trigger');
        const dropdownMenu = document.getElementById('dropdown-menu');
        const selectedTafseerLabel = document.getElementById('selected-tafseer-label');
        const dropdownItems = document.querySelectorAll('.dropdown-item');
        const ayahSearchInput = document.getElementById('ayah-search-input');
        const clearSearchBtn = document.getElementById('clear-search-btn');
        const scrollTopBtn = document.getElementById('scroll-top-btn');
        const ayahAudio = document.getElementById('ayah-audio');

        let allSurahs = [];
        let currentSurahNumber = 1;
        let currentTafseerEdition = 'ar.muyassar';
        let currentSurahData = null;
        let tafseerCache = {};
        let currentPlayingAyahBtn = null;

        // Chunk / Pagination settings
        const BATCH_SIZE = 10;
        let currentRenderedAyahsCount = 0;

        function toggleSidebar() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        menuBtn.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);

        readerArea.addEventListener('scroll', () => {
            if (readerArea.scrollTop > 300) {
                scrollTopBtn.style.display = 'flex';
            } else {
                scrollTopBtn.style.display = 'none';
            }
        });

        scrollTopBtn.addEventListener('click', () => {
            readerArea.scrollTo({ top: 0, behavior: 'smooth' });
        });

        function getQueryParams() {
            const params = new URLSearchParams(window.location.search);
            const surah = parseInt(params.get('surah')) || 1;
            const ayah = parseInt(params.get('ayah')) || null;
            const edition = params.get('tafseer') || 'ar.muyassar';
            return { surah, ayah, edition };
        }

        function fetchSurahs() {
            const cachedIndex = localStorage.getItem('quiblah_surah_index');
            if (cachedIndex) {
                try {
                    allSurahs = JSON.parse(cachedIndex);
                    renderSurahList(allSurahs);
                    checkInitialLoad();
                    return;
                } catch(e) {
                    localStorage.removeItem('quiblah_surah_index');
                }
            }

            axios.get('https://api.alquran.cloud/v1/surah')
                .then(response => {
                    allSurahs = response.data.data;
                    localStorage.setItem('quiblah_surah_index', JSON.stringify(allSurahs));
                    renderSurahList(allSurahs);
                    checkInitialLoad();
                })
                .catch(error => {
                    surahListEl.innerHTML = `<div class="error-message">حدث خطأ في تحميل قائمة السور. يرجى التحقق من اتصال الإنترنت.</div>`;
                    console.error("Error fetching surahs list:", error);
                });
        }

        function checkInitialLoad() {
            const { surah, ayah, edition } = getQueryParams();
            if (edition && (edition === 'ar.muyassar' || edition === 'ar.jalalayn')) {
                currentTafseerEdition = edition;
                updateDropdownUI(edition);
            }
            if (surah >= 1 && surah <= 114) {
                currentSurahNumber = surah;
            }
            updateActiveSurahSidebar();
            loadSurahTafseer(currentSurahNumber, ayah);
        }

        function renderSurahList(surahs) {
            if (surahs.length === 0) {
                surahListEl.innerHTML = `<div style="text-align:center; padding: 25px; color:#999; font-size:14px;">لا توجد سورة بهذا الاسم</div>`;
                return;
            }

            let html = '';
            surahs.forEach(surah => {
                const isActive = surah.number === currentSurahNumber ? 'active' : '';
                const typeText = surah.revelationType === 'Meccan' ? 'مكية' : 'مدنية';
                html += `
                    <div class="surah-item ${isActive}" data-id="${surah.number}">
                        <div class="surah-number">${surah.number}</div>
                        <div class="surah-details">
                            <div class="surah-name">${surah.name}</div>
                            <div class="surah-info">
                                <span style="color: var(--gold);">${typeText}</span>
                                <span>${surah.numberOfAyahs} آية</span>
                            </div>
                        </div>
                    </div>
                `;
            });
            surahListEl.innerHTML = html;

            document.querySelectorAll('.surah-item').forEach(item => {
                item.addEventListener('click', function() {
                    const id = parseInt(this.getAttribute('data-id'));
                    if (id !== currentSurahNumber) {
                        currentSurahNumber = id;
                        updateActiveSurahSidebar();
                        loadSurahTafseer(id);

                        if (window.innerWidth <= 850) {
                            toggleSidebar();
                        }
                    }
                });
            });
        }

        function updateActiveSurahSidebar() {
            document.querySelectorAll('.surah-item').forEach(el => {
                if (parseInt(el.getAttribute('data-id')) === currentSurahNumber) {
                    el.classList.add('active');
                    el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                } else {
                    el.classList.remove('active');
                }
            });
        }

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim().toLowerCase();
            const filtered = allSurahs.filter(s => 
                s.name.includes(query) || 
                s.englishName.toLowerCase().includes(query) ||
                s.number.toString() === query
            );
            renderSurahList(filtered);
        });

        // --- Custom Dropdown Handlers ---
        dropdownTrigger.addEventListener('click', (e) => {
            e.stopPropagation();
            const isOpen = dropdownMenu.classList.contains('show');
            if (isOpen) {
                closeDropdown();
            } else {
                openDropdown();
            }
        });

        function openDropdown() {
            dropdownMenu.classList.add('show');
            dropdownTrigger.classList.add('open');
            dropdownTrigger.setAttribute('aria-expanded', 'true');
        }

        function closeDropdown() {
            dropdownMenu.classList.remove('show');
            dropdownTrigger.classList.remove('open');
            dropdownTrigger.setAttribute('aria-expanded', 'false');
        }

        document.addEventListener('click', (e) => {
            const dropdownEl = document.getElementById('tafseer-dropdown');
            if (dropdownEl && !dropdownEl.contains(e.target)) {
                closeDropdown();
            }
        });

        dropdownItems.forEach(item => {
            item.addEventListener('click', function() {
                const val = this.getAttribute('data-value');
                selectTafseerEdition(val);
                closeDropdown();
            });
        });

        function updateDropdownUI(edition) {
            dropdownItems.forEach(it => {
                if (it.getAttribute('data-value') === edition) {
                    it.classList.add('active');
                    selectedTafseerLabel.textContent = it.querySelector('span').textContent;
                } else {
                    it.classList.remove('active');
                }
            });
        }

        function selectTafseerEdition(edition) {
            if (currentTafseerEdition === edition) return;
            currentTafseerEdition = edition;
            updateDropdownUI(edition);
            loadSurahTafseer(currentSurahNumber);
        }

        // --- Ayah Search Logic ---
        ayahSearchInput.addEventListener('input', (e) => {
            const val = e.target.value.trim();
            clearSearchBtn.style.display = val ? 'flex' : 'none';
        });

        clearSearchBtn.addEventListener('click', () => {
            ayahSearchInput.value = '';
            clearSearchBtn.style.display = 'none';
            ayahSearchInput.focus();
        });

        const searchJumpBtn = document.getElementById('search-jump-btn');
        if (searchJumpBtn) {
            searchJumpBtn.addEventListener('click', () => {
                handleAyahSearch(ayahSearchInput.value.trim());
            });
        }

        ayahSearchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                handleAyahSearch(ayahSearchInput.value.trim());
            }
        });

        function handleAyahSearch(query) {
            if (!query) return;

            // 1. If query is a pure number (e.g. 7 or 255)
            const num = parseInt(query);
            if (!isNaN(num) && num.toString() === query) {
                jumpToAyah(num);
                return;
            }

            if (!currentSurahData) return;

            // 2. Text search in verses or tafseer text
            const q = query.toLowerCase();
            const matchIndex = currentSurahData.ayahs.findIndex(a => 
                a.text.includes(q) || a.tafseer.includes(q)
            );

            if (matchIndex !== -1) {
                const matchedAyah = currentSurahData.ayahs[matchIndex];
                jumpToAyah(matchedAyah.numberInSurah);
                if (window.showToast) {
                    window.showToast(`تم العثور على نتيجة في الآية (${matchedAyah.numberInSurah})`, "fa-solid fa-magnifying-glass", 3000);
                }
            } else {
                if (window.showToast) {
                    window.showToast(`لم يتم العثور على نتائج مطابقة لـ "${query}" في هذه السورة`, "fa-solid fa-circle-exclamation", 3500);
                }
            }
        }

        function jumpToAyah(num) {
            if (!num || isNaN(num)) return;

            if (!currentSurahData) return;
            if (num < 1 || num > currentSurahData.numberOfAyahs) {
                if (window.showToast) {
                    window.showToast(`الآية رقم (${num}) غير موجودة في هذه السورة`, "fa-solid fa-circle-exclamation", 3500);
                }
                return;
            }

            // Ensure the ayah is rendered in the DOM if beyond current batch
            if (num > currentRenderedAyahsCount) {
                while (currentRenderedAyahsCount < num) {
                    appendNextBatch();
                }
            }

            const targetRow = document.getElementById(`ayah-row-${num}`);
            if (targetRow) {
                targetRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
                targetRow.classList.add('highlighted');
                setTimeout(() => {
                    targetRow.classList.remove('highlighted');
                }, 3000);
            }
        }

        function loadSurahTafseer(surahNumber, targetAyahNumber = null) {
            stopAudio();

            contentContainer.innerHTML = `
                <div class="loader-container">
                    <i class="fa-solid fa-spinner fa-spin fa-3x"></i>
                    <p>جاري تحميل نص الآيات والتفسير...</p>
                </div>
            `;

            readerArea.scrollTop = 0;

            const cacheKey = `tafseer_${currentTafseerEdition}_${surahNumber}`;
            if (tafseerCache[cacheKey]) {
                initSurahDisplay(tafseerCache[cacheKey], targetAyahNumber);
                return;
            }

            const localSaved = localStorage.getItem(cacheKey);
            if (localSaved) {
                try {
                    const parsed = JSON.parse(localSaved);
                    tafseerCache[cacheKey] = parsed;
                    initSurahDisplay(parsed, targetAyahNumber);
                    return;
                } catch(e) {
                    localStorage.removeItem(cacheKey);
                }
            }

            const url = `https://api.alquran.cloud/v1/surah/${surahNumber}/editions/quran-uthmani,${currentTafseerEdition}`;

            axios.get(url)
                .then(response => {
                    const editionsData = response.data.data;
                    const quranEdition = editionsData.find(e => e.edition.identifier === 'quran-uthmani') || editionsData[0];
                    const tafseerEdition = editionsData.find(e => e.edition.identifier === currentTafseerEdition) || editionsData[1];

                    const combinedData = {
                        number: quranEdition.number,
                        name: quranEdition.name,
                        englishName: quranEdition.englishName,
                        revelationType: quranEdition.revelationType,
                        numberOfAyahs: quranEdition.numberOfAyahs,
                        tafseerName: tafseerEdition.edition.name,
                        ayahs: quranEdition.ayahs.map((ayah, index) => {
                            const tafseerAyah = tafseerEdition.ayahs[index] || {};
                            return {
                                number: ayah.number,
                                numberInSurah: ayah.numberInSurah,
                                text: ayah.text,
                                juz: ayah.juz,
                                page: ayah.page,
                                tafseer: tafseerAyah.text || 'لا يتوفر تفسير لهذه الآية'
                            };
                        })
                    };

                    tafseerCache[cacheKey] = combinedData;
                    try {
                        localStorage.setItem(cacheKey, JSON.stringify(combinedData));
                    } catch(e) {
                        console.warn("Storage full");
                    }

                    initSurahDisplay(combinedData, targetAyahNumber);
                })
                .catch(error => {
                    console.error("Error fetching tafseer:", error);
                    contentContainer.innerHTML = `
                        <div class="error-message">
                            <i class="fa-solid fa-triangle-exclamation fa-2x" style="margin-bottom: 10px;"></i>
                            <p>تعذر جلب تفسير السورة حالياً. يرجى التأكد من اتصال الإنترنت والمحاولة مرة أخرى.</p>
                            <button onclick="loadSurahTafseer(${surahNumber})" class="jump-btn" style="margin-top: 15px; padding: 10px 20px;">
                                <i class="fa-solid fa-rotate-right"></i> إعادة المحاولة
                            </button>
                        </div>
                    `;
                });
        }

        function initSurahDisplay(data, targetAyahNumber = null) {
            currentSurahData = data;
            currentRenderedAyahsCount = 0;
            mobileTitle.innerHTML = `<i class="fa-solid fa-book-open-reader"></i> ${data.name}`;
            ayahSearchInput.placeholder = `ابحث برقم الآية (1 - ${data.numberOfAyahs}) أو كلماتها...`;

            const revelationLabel = data.revelationType === 'Meccan' ? 'مكية' : 'مدنية';

            // Clean Header - No large card box, no dark/blue badges!
            let headerHtml = `
                <div class="surah-header-section">
                    <h1 class="surah-title">${data.name}</h1>
                    <div class="surah-meta">
                        <span class="surah-meta-item"><i class="fa-solid fa-kaaba"></i> ${revelationLabel}</span>
                        <span style="color: rgba(255,255,255,0.2);">|</span>
                        <span class="surah-meta-item"><i class="fa-solid fa-list-check"></i> آياتها ${data.numberOfAyahs}</span>
                        <span style="color: rgba(255,255,255,0.2);">|</span>
                        <span class="surah-meta-item"><i class="fa-solid fa-book-bookmark"></i> الجزء ${data.ayahs[0].juz}</span>
                        <span style="color: rgba(255,255,255,0.2);">|</span>
                        <span class="surah-meta-item"><i class="fa-solid fa-file-lines"></i> صفحة ${data.ayahs[0].page}</span>
                    </div>

                    <div class="surah-header-actions">
                        <a href="quran.html?surah=${data.number}" class="header-action-link">
                            <i class="fa-solid fa-book-quran"></i> قراءة في المصحف
                        </a>
                        <button onclick="playSurahGlobalAudio(${data.number}, '${data.name}')" class="header-action-link">
                            <i class="fa-solid fa-circle-play"></i> استمع للسورة
                        </button>
                    </div>
                </div>
            `;

            if (data.number !== 1 && data.number !== 9) {
                headerHtml += `<div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>`;
            }

            // Table Structure (Names of Allah style)
            headerHtml += `
                <div class="tafseer-table-container">
                    <div class="tafseer-table-header">
                        <div class="th-num">الآية</div>
                        <div class="th-ayah">نص الآية الكريمة</div>
                        <div class="th-tafseer">التفسير (${data.tafseerName || 'المعتمد'})</div>
                    </div>
                    <div id="tafseer-rows-body"></div>
                </div>
                <div id="load-more-section"></div>
                <div id="sadaqallah-section" style="display: none;">
                    <div class="sadaqallah-box">
                        <span class="sadaqallah-line"></span>
                        <span class="sadaqallah-text">« صَدَقَ اللَّهُ الْعَظِيمُ »</span>
                        <span class="sadaqallah-line"></span>
                    </div>
                </div>
            `;

            contentContainer.innerHTML = headerHtml;

            // Determine how many ayahs to render initially
            const initialCount = targetAyahNumber ? Math.max(targetAyahNumber, BATCH_SIZE) : BATCH_SIZE;
            renderBatch(initialCount);

            if (targetAyahNumber) {
                setTimeout(() => {
                    jumpToAyah(targetAyahNumber);
                }, 200);
            }
        }

        function renderBatch(count) {
            if (!currentSurahData) return;
            const rowsBody = document.getElementById('tafseer-rows-body');
            const total = currentSurahData.ayahs.length;
            const targetCount = Math.min(currentRenderedAyahsCount + count, total);

            let rowsHtml = '';
            for (let i = currentRenderedAyahsCount; i < targetCount; i++) {
                const ayah = currentSurahData.ayahs[i];
                let text = ayah.text;
                if (currentSurahData.number !== 1 && i === 0 && text.startsWith('بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ ')) {
                    text = text.replace('بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ ', '');
                }

                rowsHtml += `
                    <div class="tafseer-row" id="ayah-row-${ayah.numberInSurah}">
                        <!-- Col 1: Number and Transparent Actions -->
                        <div class="td-controls">
                            <div class="ayah-circle-badge">${ayah.numberInSurah}</div>
                            <div class="row-action-buttons">
                                <button class="ayah-action-btn" title="استمع للآية" aria-label="استمع للآية" onclick="togglePlayAyah(this, ${ayah.number})">
                                    <i class="fa-solid fa-play"></i>
                                </button>
                                <button class="ayah-action-btn" title="نسخ الآية والتفسير" aria-label="نسخ الآية والتفسير" onclick="copyAyahTafseer(${ayah.numberInSurah})">
                                    <i class="fa-regular fa-copy"></i>
                                </button>
                                <button class="ayah-action-btn" title="مشاركة الآية والتفسير" aria-label="مشاركة الآية والتفسير" onclick="shareAyahTafseer(${ayah.numberInSurah})">
                                    <i class="fa-solid fa-share-nodes"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Col 2: The Quranic Verse -->
                        <div class="td-ayah">
                            <div class="ayah-arabic-text">
                                ${text}
                                <span class="ayah-inline-num">${ayah.numberInSurah}</span>
                            </div>
                        </div>

                        <!-- Col 3: The Tafseer -->
                        <div class="td-tafseer">
                            <div class="tafseer-text">
                                ${ayah.tafseer}
                            </div>
                        </div>
                    </div>
                `;
            }

            rowsBody.insertAdjacentHTML('beforeend', rowsHtml);
            currentRenderedAyahsCount = targetCount;

            updateLoadMoreSection();
        }

        function appendNextBatch() {
            renderBatch(BATCH_SIZE);
        }

        function updateLoadMoreSection() {
            const loadMoreSection = document.getElementById('load-more-section');
            const sadaqallahSection = document.getElementById('sadaqallah-section');
            if (!loadMoreSection || !currentSurahData) return;

            const remaining = currentSurahData.numberOfAyahs - currentRenderedAyahsCount;

            if (remaining > 0) {
                loadMoreSection.innerHTML = `
                    <div class="load-more-container">
                        <button id="load-more-btn" class="load-more-btn" onclick="appendNextBatch()">
                            <i class="fa-solid fa-angles-down"></i> تحميل باقي الآيات (متبقي ${remaining} آية)
                        </button>
                    </div>
                `;
                if (sadaqallahSection) sadaqallahSection.style.display = 'none';
            } else {
                loadMoreSection.innerHTML = '';
                if (sadaqallahSection) sadaqallahSection.style.display = 'block';
            }
        }

        function togglePlayAyah(btn, globalAyahNum) {
            const audioSrc = `https://cdn.islamic.network/quran/audio/128/ar.alafasy/${globalAyahNum}.mp3`;

            if (currentPlayingAyahBtn === btn && !ayahAudio.paused) {
                stopAudio();
                return;
            }

            stopAudio();

            ayahAudio.src = audioSrc;
            currentPlayingAyahBtn = btn;
            btn.classList.add('playing');
            btn.innerHTML = `<i class="fa-solid fa-pause"></i>`;
            btn.title = "إيقاف التلاوة";

            ayahAudio.play().catch(err => {
                console.warn("Audio play failed:", err);
                stopAudio();
                if (window.showToast) {
                    window.showToast("تعذر تشغيل الصوت للآية، يرجى المحاولة لاحقاً", "fa-solid fa-triangle-exclamation", 3500);
                }
            });
        }

        function stopAudio() {
            if (!ayahAudio.paused) {
                ayahAudio.pause();
            }
            if (currentPlayingAyahBtn) {
                currentPlayingAyahBtn.classList.remove('playing');
                currentPlayingAyahBtn.innerHTML = `<i class="fa-solid fa-play"></i>`;
                currentPlayingAyahBtn.title = "استمع للآية";
                currentPlayingAyahBtn = null;
            }
        }

        ayahAudio.addEventListener('ended', () => stopAudio());
        ayahAudio.addEventListener('error', () => stopAudio());

        function copyAyahTafseer(ayahNumberInSurah) {
            if (!currentSurahData) return;
            const ayah = currentSurahData.ayahs.find(a => a.numberInSurah === ayahNumberInSurah);
            if (!ayah) return;

            const copyText = `﴿ ${ayah.text} ﴾ [${currentSurahData.name} : آية ${ayah.numberInSurah}]\n\n📖 ${currentSurahData.tafseerName}:\n${ayah.tafseer}\n\n— عبر تطبيق قبلة المسلم`;

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(copyText)
                    .then(() => {
                        if (window.showToast) {
                            window.showToast(`تم نسخ الآية (${ayahNumberInSurah}) وتفسيرها بنجاح`, "fa-solid fa-check", 3000);
                        }
                    })
                    .catch(() => fallbackCopy(copyText));
            } else {
                fallbackCopy(copyText);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            if (window.showToast) {
                window.showToast("تم نسخ الآية وتفسيرها للحافظة", "fa-solid fa-check", 3000);
            }
        }

        function shareAyahTafseer(ayahNumberInSurah) {
            if (!currentSurahData) return;
            const ayah = currentSurahData.ayahs.find(a => a.numberInSurah === ayahNumberInSurah);
            if (!ayah) return;

            const shareData = {
                title: `${currentSurahData.name} - آية ${ayah.numberInSurah}`,
                text: `﴿ ${ayah.text} ﴾ [${currentSurahData.name} : ${ayah.numberInSurah}]\n\n📖 التفسير:\n${ayah.tafseer}`,
                url: `${window.location.origin}${window.location.pathname}?surah=${currentSurahData.number}&ayah=${ayah.numberInSurah}`
            };

            if (navigator.share) {
                navigator.share(shareData).catch(err => console.log("Share canceled", err));
            } else {
                copyAyahTafseer(ayahNumberInSurah);
            }
        }

        fetchSurahs();
    </script>
    <script src="toast.js"></script>
    <script src="pwa.js"></script>
</body>
</html>
